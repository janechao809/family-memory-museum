<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>占位</title>
</head>
<body class="min-h-screen bg-background font-sans antialiased">
  <!--
    桌面策展人 shell（document-scroll）
    - sticky 左侧栏 240px（w-60）：展览名 + 五项导航(home/gallery/create/visit/mine)，home 高亮
    - 顶栏：curatorTopbar 规范（策展工作台标题 + 预览参观 + 头像）
    - 右侧内容区 main slot
    - 侧栏用 position: sticky; top: 0; height: 100vh（非 fixed app-shell）
    - 叶子页按自己 activeKey 替换侧栏高亮项
  -->
  <div class="mx-auto flex w-full max-w-[1440px] min-h-screen bg-background">
    <!-- 左侧栏：curatorSidebar 规范，home 高亮（activeItemClasses: text-primary bg-secondary font-medium） -->
    <aside class="sticky top-0 hidden h-screen w-60 shrink-0 flex-col border-r border-border bg-sidebar md:flex">
      <div class="flex items-center gap-2 px-6 py-5">
        <span class="h-2.5 w-2.5 rounded-full bg-primary"></span>
        <span class="font-serif text-lg text-foreground">家·记忆博物馆</span>
      </div>
      <nav class="flex flex-1 flex-col gap-1 px-3">
        <a data-nav-item data-nav-key="home" data-dom-id="fmm-nav-home" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-primary bg-secondary font-medium"><i data-lucide="home" class="h-[18px] w-[18px]"></i>首页</a>
        <a data-nav-item data-nav-key="gallery" data-dom-id="fmm-nav-gallery" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-sidebar-foreground/70 hover:bg-sidebar-accent/60 hover:text-sidebar-foreground"><i data-lucide="layout-grid" class="h-[18px] w-[18px]"></i>展馆</a>
        <a data-nav-item data-nav-key="create" data-dom-id="fmm-nav-create" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-sidebar-foreground/70 hover:bg-sidebar-accent/60 hover:text-sidebar-foreground"><i data-lucide="plus" class="h-[18px] w-[18px]"></i>创建</a>
        <a data-nav-item data-nav-key="visit" data-dom-id="fmm-nav-visit" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-sidebar-foreground/70 hover:bg-sidebar-accent/60 hover:text-sidebar-foreground"><i data-lucide="eye" class="h-[18px] w-[18px]"></i>参观</a>
        <a data-nav-item data-nav-key="mine" data-dom-id="fmm-nav-mine" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-sidebar-foreground/70 hover:bg-sidebar-accent/60 hover:text-sidebar-foreground"><i data-lucide="user" class="h-[18px] w-[18px]"></i>我的</a>
      </nav>
      <div class="flex items-center gap-2 px-6 py-4 text-xs text-muted-foreground">
        <i data-lucide="lock" class="h-3.5 w-3.5"></i>
        <span>仅家庭成员可见</span>
      </div>
    </aside>

    <!-- 右侧：顶栏 + 内容区 -->
    <div class="flex min-h-screen flex-1 flex-col">
      <!-- 顶栏：curatorTopbar 规范 -->
      <header class="sticky top-0 z-30 flex items-center justify-between border-b border-border bg-card/80 px-8 py-3 backdrop-blur">
        <div class="text-sm text-muted-foreground">策展工作台 · 一件物品里的陪伴</div>
        <div class="flex items-center gap-4">
          <a data-dom-id="fmm-enter-visit" class="inline-flex items-center gap-1.5 rounded-lg border border-border px-3 py-1.5 text-sm text-foreground hover:bg-muted"><i data-lucide="eye" class="h-4 w-4"></i>预览参观</a>
          <div class="h-8 w-8 rounded-full bg-secondary text-center text-xs leading-8 text-primary">满</div>
        </div>
      </header>

      <!-- 内容区 main slot -->
      <main id="fmm-page-content" class="flex-1 bg-background p-8">
        <!-- 叶子页在此填充页面内容 -->
      </main>
    </div>
  </div>

  <script>if(window.lucide){lucide.createIcons();}</script>
</body>
</html>
