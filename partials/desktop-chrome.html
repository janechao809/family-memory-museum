<!DOCTYPE html>

<title>占位</title>

<body class="min-h-screen bg-background font-sans antialiased">

    桌面端 chrome 骨架（document-scroll）

    - 不含侧栏 / 顶栏（由 curator-desktop / visitor-desktop 注入）
  -->
  <div class="mx-auto w-full max-w-[1440px] min-h-screen bg-background">

    <main id="fmm-page-content" class="min-h-screen bg-background p-8">
      <!-- 叶子页在此填充页面内容 -->
    </main>
  </div>
