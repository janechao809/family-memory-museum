<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⑤展签与语音导览</title>
    <style id="theme-vars">
@import "tailwindcss";

@custom-variant dark (&:is(.dark *));

:root {
  /* —— 语义表面 —— */
  --background: #F7F2E9;          /* bg.canvas 暖白纸 */
  --foreground: #243A36;          /* text.primary */
  --card: #FFFDF8;                /* bg.surface */
  --card-foreground: #243A36;
  --popover: #FFFDF8;
  --popover-foreground: #243A36;

  /* —— 品牌 / 主操作 —— */
  --primary: #315B50;             /* brand.forest 主按钮/链接 */
  --primary-foreground: #FFFDF8;
  --secondary: #DDE8E2;           /* accent.mist 选中态 */
  --secondary-foreground: #243A36;
  --accent: #D8A84D;              /* accent.mustard 编号/路径节点 */
  --accent-foreground: #243A36;
  --muted: #EFE7D8;
  --muted-foreground: #63736D;    /* text.secondary */

  /* —— 描边 / 输入 / 聚焦 —— */
  --border: #E7DDD0;              /* border.soft */
  --input: #E7DDD0;
  --ring: #315B50;

  /* —— 自定义品牌色（多色相，用户文档显式指定） —— */
  --terracotta: #B86A4A;          /* brand.terracotta 录音/强调 */
  --terracotta-foreground: #FFFDF8;
  --private: #5D6F8B;             /* status.private 私密标记 */
  --private-foreground: #FFFDF8;

  /* —— 图表（低饱和档案感） —— */
  --chart-1: #315B50;
  --chart-2: #B86A4A;
  --chart-3: #D8A84D;
  --chart-4: #5D6F8B;
  --chart-5: #63736D;

  /* —— 侧栏 —— */
  --sidebar: #FFFDF8;
  --sidebar-foreground: #243A36;
  --sidebar-primary: #315B50;
  --sidebar-primary-foreground: #FFFDF8;
  --sidebar-accent: #DDE8E2;
  --sidebar-accent-foreground: #243A36;
  --sidebar-border: #E7DDD0;
  --sidebar-ring: #315B50;

  /* —— 圆角 —— */
  --radius: 16px;
  /* 品牌前缀语义别名（fill-html-head.mjs semantic mapping） */
  --fmm-radius-sm: 12px;
  --fmm-radius-md: 12px;
  --fmm-radius-lg: 16px;
  --fmm-radius-xl: 20px;
  --fmm-radius-2xl: 24px;

  /* —— 字体族 —— */
  --font-serif: "Noto Serif SC", "Songti SC", serif;
  --font-sans: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* —— 语义别名（semantic-token-fallback） —— */
  --semantic-bg-canvas: var(--background);
  --semantic-bg-surface: var(--card);
  --semantic-bg-muted: var(--muted);
  --semantic-text-primary: var(--foreground);
  --semantic-text-secondary: var(--muted-foreground);
  --semantic-text-on-primary: var(--primary-foreground);
  --semantic-brand-forest: var(--primary);
  --semantic-brand-terracotta: var(--terracotta);
  --semantic-accent-mustard: var(--accent);
  --semantic-accent-mist: var(--secondary);
  --semantic-border-soft: var(--border);
  --semantic-status-private: var(--private);
  --semantic-ring: var(--ring);
}

.dark {
  --background: #1E2B27;
  --foreground: #F2EBDC;
  --card: #26332F;
  --card-foreground: #F2EBDC;
  --popover: #26332F;
  --popover-foreground: #F2EBDC;
  --primary: #6FA89B;
  --primary-foreground: #1E2B27;
  --secondary: #3A4A44;
  --secondary-foreground: #F2EBDC;
  --accent: #E0BC6A;
  --accent-foreground: #1E2B27;
  --muted: #313F3A;
  --muted-foreground: #9CA8A2;
  --border: #3A4A44;
  --input: #3A4A44;
  --ring: #6FA89B;
  --terracotta: #D08A68;
  --terracotta-foreground: #1E2B27;
  --private: #8AA0BD;
  --private-foreground: #1E2B27;
  --chart-1: #6FA89B;
  --chart-2: #D08A68;
  --chart-3: #E0BC6A;
  --chart-4: #8AA0BD;
  --chart-5: #9CA8A2;
  --sidebar: #26332F;
  --sidebar-foreground: #F2EBDC;
  --sidebar-primary: #6FA89B;
  --sidebar-primary-foreground: #1E2B27;
  --sidebar-accent: #3A4A44;
  --sidebar-accent-foreground: #F2EBDC;
  --sidebar-border: #3A4A44;
  --sidebar-ring: #6FA89B;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-terracotta: var(--terracotta);
  --color-terracotta-foreground: var(--terracotta-foreground);
  --color-private: var(--private);
  --color-private-foreground: var(--private-foreground);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --font-sans: var(--font-sans);
  --font-serif: var(--font-serif);
  --font-mono: var(--font-mono);

  --radius-sm: calc(var(--radius) - 4px);   /* 12 */
  --radius-md: calc(var(--radius) - 4px);   /* 12 */
  --radius-lg: var(--radius);               /* 16 */
  --radius-xl: calc(var(--radius) + 4px);   /* 20 */
  --radius-2xl: calc(var(--radius) + 8px);  /* 24 浮层专用 */
}

@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, .font-serif {
    font-family: var(--font-serif);
  }
}

    </style>

<body class="min-h-screen bg-background font-sans antialiased">
  <div class="mx-auto w-full max-w-[420px] min-h-screen bg-background">
    <!-- 极简顶栏：照搬 curator-mobile.html -->
    <header class="sticky top-0 z-30 border-b border-border bg-card/80 backdrop-blur" style="padding-top:env(safe-area-inset-top)">
      <div class="flex items-center justify-between px-5 py-3">
        <span class="font-serif text-base text-foreground">家庭记忆博物馆</span>
        <a href="#" data-dom-id="fmm-nav-mine" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-muted-foreground hover:bg-muted hover:text-foreground">
          <i data-lucide="user" class="h-[18px] w-[18px]"></i>
        </a>
      </div>
    </header>

    <!-- 内容区 main slot：底部留出 fixed nav 高度 + 安全区 -->
    <main id="fmm-page-content" class="min-h-screen bg-background px-5 pb-[calc(72px+env(safe-area-inset-bottom))]">

      <!-- 步骤上下文 -->
      <section class="pt-5">
        <div class="flex items-center gap-1.5">
          <i data-lucide="tag" class="h-3.5 w-3.5 text-muted-foreground"></i>
          <span class="text-[12px] text-muted-foreground">展签与语音导览 · 第 5 步</span>
        </div>
      </section>

      <!-- ① 展品大图区：满宽 4:3 + 左上 mustard 编号徽章 + 物品名 + 副标 -->
      <section class="pt-4">
        <div class="relative overflow-hidden rounded-lg">
          <img id="fmm-exhibit-photo" src="../assets/exhibit-enamel-mug.jpg" alt="搪瓷杯" class="block aspect-[4/3] w-full object-cover" />
          <span data-fmm-preview="number" class="absolute left-3 top-3 inline-flex items-center rounded-md bg-accent px-2 py-1 font-serif text-[12px] font-medium text-accent-foreground">妈妈—01</span>
        </div>
        <h1 data-fmm-preview="name" class="mt-3 font-serif text-[24px] leading-tight text-foreground">搪瓷杯</h1>
        <p data-fmm-preview="subtitle" class="mt-1 text-[12px] text-muted-foreground">70年代 · 外婆陪嫁 · 讲述者 林雯</p>
      </section>

      <!-- ② 展签编辑卡：bg-card border rounded-lg p-4，逐项可编辑表单 -->
      <section class="pt-5">
        <div data-dom-id="fmm-label-field" class="rounded-lg border border-border bg-card p-4">
          <div class="flex items-center gap-2">
            <i data-lucide="file-text" class="h-4 w-4 text-muted-foreground"></i>
            <h2 class="font-serif text-[16px] text-foreground">展签编辑</h2>
          </div>

          <div class="mt-3 space-y-3">
            <!-- 编号 + 物品名 -->
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-[12px] font-medium text-muted-foreground">编号</label>
                <input type="text" data-fmm-field="number" value="妈妈—01" class="mt-1 block w-full rounded-md border border-border bg-background px-3 py-2 font-serif text-[14px] text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20" />
              </div>
              <div>
                <label class="text-[12px] font-medium text-muted-foreground">物品名</label>
                <input type="text" data-fmm-field="name" value="搪瓷杯" class="mt-1 block w-full rounded-md border border-border bg-background px-3 py-2 text-[14px] text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20" />
              </div>
            </div>

            <!-- 年代 / 来源 / 讲述者 -->
            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="text-[11px] font-medium text-muted-foreground">年代</label>
                <input type="text" data-fmm-field="year" value="70年代" class="mt-1 block w-full rounded-md border border-border bg-background px-2 py-2 text-[13px] text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20" />
              </div>
              <div>
                <label class="text-[11px] font-medium text-muted-foreground">来源</label>
                <input type="text" data-fmm-field="source" value="外婆陪嫁" class="mt-1 block w-full rounded-md border border-border bg-background px-2 py-2 text-[13px] text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20" />
              </div>
              <div>
                <label class="text-[11px] font-medium text-muted-foreground">讲述者</label>
                <input type="text" data-fmm-field="teller" value="林雯" class="mt-1 block w-full rounded-md border border-border bg-background px-2 py-2 text-[13px] text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20" />
              </div>
            </div>

            <!-- 展签文案 -->
            <div>
              <label class="text-[12px] font-medium text-muted-foreground">展签文案</label>
              <textarea data-fmm-field="label" class="mt-1 block min-h-[96px] w-full resize-none rounded-md border border-border bg-background px-3 py-2.5 text-[14px] leading-relaxed text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20"></textarea>
            </div>
          </div>
        </div>
      </section>

      <!-- ③ 30 秒语音区：文字稿 + 录音 + 试听 + 进度 + 静音开关 -->
      <section class="pt-4">
        <div class="rounded-lg border border-border bg-card p-4">
          <!-- 标题 + 静音开关 -->
          <div class="flex items-start justify-between gap-3">
            <div>
              <h2 class="font-serif text-[16px] text-foreground">30 秒语音导览</h2>
              <p class="mt-0.5 text-[12px] text-muted-foreground">默认静音，参观者手动开启</p>
            </div>
            <div class="flex items-center gap-1.5">
              <i data-lucide="volume-x" class="h-4 w-4 text-muted-foreground"></i>
              <button data-fmm-role="mute" role="switch" aria-checked="true" class="relative h-6 w-11 shrink-0 rounded-full bg-primary">
                <span class="absolute right-0.5 top-0.5 h-5 w-5 rounded-full bg-primary-foreground"></span>
              </button>
            </div>
          </div>

          <!-- 文字稿编辑框 -->
          <div class="mt-3">
            <label class="text-[12px] font-medium text-muted-foreground">语音文字稿</label>
            <textarea data-fmm-field="audioScript" class="mt-1 block min-h-[120px] w-full resize-none rounded-md border border-border bg-background px-3 py-2.5 text-[14px] leading-relaxed text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20"></textarea>
          </div>

          <!-- 录音键 + 试听键 + 进度条 -->
          <div class="mt-4 flex items-center gap-4">
            <!-- 录音键：terracotta 圆形 -->
            <div class="flex flex-col items-center gap-1.5 shrink-0">
              <button type="button" data-fmm-role="record" class="flex h-14 w-14 items-center justify-center rounded-full bg-terracotta text-terracotta-foreground shadow-sm transition active:scale-95">
                <i data-lucide="mic" class="h-5 w-5"></i>
              </button>
              <span class="text-[11px] text-muted-foreground">按住录制</span>
            </div>

            <!-- 试听键 + 进度 -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2.5">
                <button type="button" data-fmm-role="play" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-border bg-card text-foreground active:opacity-90">
                  <i data-lucide="play" class="h-4 w-4"></i>
                </button>
                <div class="flex-1 min-w-0">
                  <div class="h-1.5 rounded-full bg-muted">
                    <div class="h-1.5 rounded-full bg-terracotta" style="width:93%"></div>
                  </div>
                  <div class="mt-1 flex justify-between text-[11px] text-muted-foreground">
                    <span>0:28</span>
                    <span>0:30</span>
                  </div>
                </div>
              </div>
              <p class="mt-1.5 text-[11px] text-muted-foreground">试听录制效果</p>
            </div>
          </div>
        </div>
      </section>

      <!-- ④ 底部双按钮：上一展品（surface 描边）+ 完成·发布展览（bg-primary） -->
      <section class="pt-6">
        <p data-fmm-progress class="mb-2.5 text-center text-[12px] text-muted-foreground">第 1 / 5 件</p>
        <div class="flex gap-3">
          <button type="button" data-dom-id="fmm-prev-exhibit" class="flex-1 rounded-lg border border-border bg-card px-5 py-3 text-[15px] font-medium text-foreground active:opacity-90">
            上一展品
          </button>
          <button type="button" data-dom-id="fmm-next-exhibit" class="flex flex-[1.4] items-center justify-center gap-2 rounded-lg bg-primary px-5 py-3 text-[15px] font-medium text-primary-foreground active:opacity-90">
            <span>完成·发布展览</span>
            <i data-lucide="arrow-right" class="h-4 w-4"></i>
          </button>
        </div>
        <p class="mt-2.5 text-center text-[12px] leading-snug text-muted-foreground">完成后进入参观视角，预览你的展览。</p>
      </section>

    </main>
  </div>

  <!-- 底部五栏 nav：canonicalHtmlByKey["create"]（create active） -->
  <nav data-mobile-nav="global" class="fixed bottom-0 inset-x-0 z-40 border-t border-border bg-card/95 backdrop-blur" style="padding-bottom:env(safe-area-inset-bottom)"><div class="mx-auto grid w-full max-w-[420px] grid-cols-5"><a data-nav-item data-nav-key="home" data-dom-id="fmm-nav-home" class="relative flex flex-col items-center justify-center gap-1 pt-2.5 pb-3 text-[11px] font-medium text-muted-foreground"><i data-lucide="home" class="h-[22px] w-[22px]"></i><span class="leading-none">首页</span></a><a data-nav-item data-nav-key="gallery" data-dom-id="fmm-nav-gallery" class="relative flex flex-col items-center justify-center gap-1 pt-2.5 pb-3 text-[11px] font-medium text-muted-foreground"><i data-lucide="layout-grid" class="h-[22px] w-[22px]"></i><span class="leading-none">展馆</span></a><a data-nav-item data-nav-key="create" data-dom-id="fmm-nav-create" class="relative flex flex-col items-center justify-center gap-1 pt-2.5 pb-3 text-[11px] font-medium text-primary"><span class="absolute top-0 h-[3px] w-7 rounded-full bg-primary"></span><i data-lucide="plus" class="h-[22px] w-[22px]"></i><span class="leading-none">创建</span></a><a data-nav-item data-nav-key="visit" data-dom-id="fmm-nav-visit" class="relative flex flex-col items-center justify-center gap-1 pt-2.5 pb-3 text-[11px] font-medium text-muted-foreground"><i data-lucide="eye" class="h-[22px] w-[22px]"></i><span class="leading-none">参观</span></a><a data-nav-item data-nav-key="mine" data-dom-id="fmm-nav-mine" class="relative flex flex-col items-center justify-center gap-1 pt-2.5 pb-3 text-[11px] font-medium text-muted-foreground"><i data-lucide="user" class="h-[22px] w-[22px]"></i><span class="leading-none">我的</span></a></div></nav>

  <script>if(window.lucide){lucide.createIcons();}</script>
  <script src="../assets/fmm-app.js"></script>
  <script>
  (function(){
    function ready(fn){
      if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', fn); }
      else { fn(); }
    }
    function replaceIcon(el, name){
      if(!el) return;
      var cls = (el.getAttribute('class') || '').replace(/\blucide\S*/g, '').replace(/\s+/g, ' ').trim();
      var ni = document.createElement('i');
      ni.setAttribute('data-lucide', name);
      if(cls){ ni.setAttribute('class', cls); }
      el.parentNode.replaceChild(ni, el);
      if(window.lucide){ lucide.createIcons(); }
    }

    /* —— FMM 数据层快捷封装 —— */
    function getIdx(){
      return (window.FMM && typeof FMM.currentIdx === 'function') ? FMM.currentIdx() : 0;
    }
    function getExhibit(){
      return (window.FMM && typeof FMM.getExhibit === 'function') ? FMM.getExhibit(getIdx()) : null;
    }
    function setExhibit(patch){
      if(window.FMM && typeof FMM.setExhibit === 'function'){ FMM.setExhibit(getIdx(), patch); }
    }
    function buildSubtitle(ex){
      if(!ex) return '';
      var parts = [];
      if(ex.year) parts.push(ex.year);
      if(ex.source) parts.push(ex.source);
      if(ex.teller) parts.push('讲述者 ' + ex.teller);
      return parts.join(' · ');
    }
    function syncPreview(ex){
      if(!ex) return;
      var map = { 'number': ex.number, 'name': ex.name, 'label': ex.label, 'subtitle': buildSubtitle(ex) };
      Object.keys(map).forEach(function(k){
        var nodes = document.querySelectorAll('[data-fmm-preview="'+k+'"]');
        for(var i=0;i<nodes.length;i++){ nodes[i].textContent = map[k] || ''; }
      });
    }

    ready(function(){
      var ex = getExhibit();

      /* —— 0. 进度提示：当前第几件 / 共 5 件 —— */
      var progressEl = document.querySelector('[data-fmm-progress]');
      if(progressEl){
        progressEl.textContent = '第 ' + (getIdx() + 1) + ' / 5 件';
      }

      /* —— 1. 展签字段持久化：加载时从 FMM 恢复，input 时写回 —— */
      var fields = document.querySelectorAll('[data-fmm-field]');
      if(ex){
        for(var i=0;i<fields.length;i++){
          var f = fields[i];
          var key = f.getAttribute('data-fmm-field');
          if(ex[key] !== undefined && ex[key] !== null){ f.value = ex[key]; }
        }
        syncPreview(ex);

        /* 展品图片：优先用户上传 photo，否则按 idx 取默认图 */
        var photoImg = document.getElementById('fmm-exhibit-photo');
        if(photoImg){
          var PHOTO_MAP = ['exhibit-enamel-mug.jpg','exhibit-photo-album.jpg','exhibit-mechanical-watch.jpg','exhibit-textbook.jpg','exhibit-fountain-pen.jpg'];
          var NAME_MAP = ['搪瓷杯','相册','机械表','课本','钢笔'];
          var idx = getIdx();
          if(ex.photo){ photoImg.src = ex.photo; }
          else if(PHOTO_MAP[idx]){ photoImg.src = '../assets/' + PHOTO_MAP[idx]; }
          photoImg.alt = ex.name || NAME_MAP[idx] || '展品';
        }

        /* 语音文字稿：无 audioScript 时用 story 作为默认（不持久化，用户编辑后再存） */
        var scriptField = document.querySelector('[data-fmm-field="audioScript"]');
        if(scriptField && !ex.audioScript && ex.story){
          scriptField.value = ex.story;
        }
      }
      for(var j=0;j<fields.length;j++){
        (function(el){
          var key = el.getAttribute('data-fmm-field');
          el.addEventListener('input', function(){
            var patch = {};
            patch[key] = el.value;
            setExhibit(patch);
            var cur = getExhibit();
            if(cur){ cur[key] = el.value; syncPreview(cur); }
          });
        })(fields[j]);
      }

      /* —— 2. 真实录音：MediaRecorder —— */
      var recBtn = document.querySelector('[data-fmm-role="record"]');
      var recLabel = recBtn ? recBtn.nextElementSibling : null;
      var mediaRecorder = null, recChunks = [], recStream = null;

      if(recBtn){
        /* 已有录音时初始化标签 */
        if(ex && ex.audio && recLabel){ recLabel.textContent = '已录制'; }

        recBtn.addEventListener('click', function(){
          /* 正在录音 → 停止 */
          if(mediaRecorder && mediaRecorder.state === 'recording'){
            try { mediaRecorder.stop(); } catch(e){}
            return;
          }
          /* 已有录音 → 提示 */
          var curEx = getExhibit();
          if(curEx && curEx.audio){
            alert('已录制');
            return;
          }
          /* 能力检测 */
          if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined'){
            alert('当前浏览器不支持录音功能');
            return;
          }
          navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
            recStream = stream;
            try {
              mediaRecorder = new MediaRecorder(stream);
            } catch(e){
              alert('当前浏览器不支持录音功能');
              stream.getTracks().forEach(function(t){ t.stop(); });
              recStream = null;
              return;
            }
            recChunks = [];
            mediaRecorder.ondataavailable = function(e){
              if(e.data && e.data.size > 0){ recChunks.push(e.data); }
            };
            mediaRecorder.onstop = function(){
              if(recStream){ recStream.getTracks().forEach(function(t){ t.stop(); }); recStream = null; }
              var mime = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : 'audio/webm';
              var blob = new Blob(recChunks, { type: mime });
              var reader = new FileReader();
              reader.onload = function(){
                var dataUrl = reader.result;
                setExhibit({ audio: dataUrl });
                /* 恢复按钮样式 */
                recBtn.style.backgroundColor = '';
                recBtn.style.transform = '';
                recBtn.style.boxShadow = '';
                if(recLabel){ recLabel.textContent = '已录制'; }
                mediaRecorder = null;
                recChunks = [];
              };
              reader.onerror = function(){
                recBtn.style.backgroundColor = '';
                recBtn.style.transform = '';
                recBtn.style.boxShadow = '';
                if(recLabel){ recLabel.textContent = '按住录制'; }
                alert('录音读取失败，请重试');
              };
              reader.readAsDataURL(blob);
            };
            mediaRecorder.start();
            recBtn.style.backgroundColor = '#dc2626';
            recBtn.style.transform = 'scale(1.1)';
            recBtn.style.boxShadow = '0 0 0 4px rgba(220,38,38,0.2)';
            if(recLabel){ recLabel.textContent = '正在录音… 点击停止'; }
          }).catch(function(err){
            mediaRecorder = null;
            var name = err && err.name ? err.name : '';
            if(name === 'NotAllowedError' || name === 'SecurityError'){
              alert('麦克风权限被拒绝，请在浏览器设置中允许后重试');
            } else if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
              alert('未检测到麦克风设备');
            } else {
              alert('无法访问麦克风：' + (err && err.message ? err.message : '未知错误'));
            }
          });
        });
      }

      /* —— 3. 试听播放真实录音 —— */
      var playBtn = document.querySelector('[data-fmm-role="play"]');
      if(playBtn){
        var playWrap = playBtn.parentElement ? playBtn.parentElement.parentElement : null;
        var playLabel = playWrap ? playWrap.querySelector('p') : null;
        var progContainer = playBtn.parentElement ? playBtn.parentElement.querySelector('.flex-1') : null;
        var progFill = progContainer ? progContainer.querySelector('[style*="width"]') : null;
        var progTimes = progContainer ? progContainer.querySelectorAll('span') : null;
        var audioEl = null, playing = false, playTimer = null;

        function fmtTime(sec){
          if(!sec || !isFinite(sec)){ sec = 0; }
          var m = Math.floor(sec/60);
          var s = Math.floor(sec%60);
          return m + ':' + (s < 10 ? '0'+s : s);
        }
        function setPlayIcon(name){ replaceIcon(playBtn.querySelector('svg, i'), name); }
        function resetPlayUI(){
          playing = false;
          setPlayIcon('play');
          if(playLabel){ playLabel.textContent = '试听'; }
          if(progFill){ progFill.style.width = '0%'; }
          if(progTimes && progTimes[0]){ progTimes[0].textContent = '0:00'; }
          if(playTimer){ clearInterval(playTimer); playTimer = null; }
        }
        /* 初始进度归零 */
        if(progFill){ progFill.style.width = '0%'; }
        if(progTimes && progTimes[0]){ progTimes[0].textContent = '0:00'; }
        if((!ex || !ex.audio) && progTimes && progTimes[1]){ progTimes[1].textContent = '0:00'; }

        playBtn.addEventListener('click', function(){
          var curEx = getExhibit();
          if(!curEx || !curEx.audio){
            alert('请先录音');
            return;
          }
          if(playing){
            if(audioEl){ audioEl.pause(); }
            playing = false;
            setPlayIcon('play');
            if(playLabel){ playLabel.textContent = '试听'; }
            if(playTimer){ clearInterval(playTimer); playTimer = null; }
            return;
          }
          if(!audioEl){
            audioEl = new Audio(curEx.audio);
            audioEl.addEventListener('ended', function(){
              if(progFill){ progFill.style.width = '100%'; }
              if(audioEl && progTimes && progTimes[0]){ progTimes[0].textContent = fmtTime(audioEl.duration); }
              playing = false;
              setPlayIcon('play');
              if(playLabel){ playLabel.textContent = '试听'; }
              if(playTimer){ clearInterval(playTimer); playTimer = null; }
            });
            audioEl.addEventListener('loadedmetadata', function(){
              if(audioEl && progTimes && progTimes[1]){ progTimes[1].textContent = fmtTime(audioEl.duration); }
            });
          } else {
            audioEl.src = curEx.audio;
            audioEl.currentTime = 0;
          }
          if(progFill){ progFill.style.width = '0%'; }
          audioEl.play().then(function(){
            playing = true;
            setPlayIcon('pause');
            if(playLabel){ playLabel.textContent = '暂停'; }
            if(audioEl && audioEl.duration && progTimes && progTimes[1]){ progTimes[1].textContent = fmtTime(audioEl.duration); }
            if(playTimer){ clearInterval(playTimer); }
            playTimer = setInterval(function(){
              if(!audioEl){ return; }
              var d = audioEl.duration || 0;
              var c = audioEl.currentTime || 0;
              var pct = d > 0 ? (c/d*100) : 0;
              if(progFill){ progFill.style.width = pct + '%'; }
              if(progTimes && progTimes[0]){ progTimes[0].textContent = fmtTime(c); }
            }, 120);
          }).catch(function(){
            resetPlayUI();
            alert('播放失败，请重新录音');
          });
        });
      }

      /* —— 4. 静音开关：保留现有切换逻辑（展品可见性控制，不改持久化） —— */
      var muteBtn = document.querySelector('[data-fmm-role="mute"]');
      if(muteBtn){
        var muted = true;
        muteBtn.addEventListener('click', function(){
          muted = !muted;
          var knob = muteBtn.querySelector('span');
          var head = muteBtn.closest('.flex.items-start');
          var p = head ? head.querySelector('p') : null;
          if(muted){
            muteBtn.classList.add('bg-primary'); muteBtn.classList.remove('bg-muted');
            muteBtn.setAttribute('aria-checked','true');
            if(knob){ knob.classList.add('right-0.5'); knob.classList.remove('left-0.5'); }
            if(p){ p.textContent = '默认静音'; }
            replaceIcon(muteBtn.previousElementSibling, 'volume-x');
          } else {
            muteBtn.classList.remove('bg-primary'); muteBtn.classList.add('bg-muted');
            muteBtn.setAttribute('aria-checked','false');
            if(knob){ knob.classList.remove('right-0.5'); knob.classList.add('left-0.5'); }
            if(p){ p.textContent = '已开启声音'; }
            replaceIcon(muteBtn.previousElementSibling, 'volume-2');
          }
        });
      }

      /* 上一展品：保存当前表单 → 循环切换到上一件展品 → 刷新当前页面 */
      var prevExhibitBtn = document.querySelector('[data-dom-id="fmm-prev-exhibit"]');
      if(prevExhibitBtn){
        prevExhibitBtn.addEventListener('click', function(){
          // 1. 保存当前表单数据到 FMM
          var curIdx = FMM.currentIdx();
          var fields = document.querySelectorAll('[data-fmm-field]');
          var patch = {};
          fields.forEach(function(f){
            var key = f.getAttribute('data-fmm-field');
            patch[key] = f.value;
          });
          if(Object.keys(patch).length > 0){ FMM.setExhibit(curIdx, patch); }

          // 2. 切换到上一个展品（到 0 时循环到最后一个）
          var prevIdx = curIdx > 0 ? curIdx - 1 : 4;
          FMM.setCurrentIdx(prevIdx);

          // 3. 刷新当前页面（带时间戳防缓存）
          location.href = location.pathname + '?t=' + Date.now();
        });
      }

      /* 跳转兜底 */
      var jumps = { 'fmm-next-exhibit': 'page-visit-exhibit-mobile.html' };
      Object.keys(jumps).forEach(function(domId){
        var el = document.querySelector('[data-dom-id="'+domId+'"]');
        if(el){ el.addEventListener('click', function(){ location.href = jumps[domId]; }); }
      });
      /* 底部五栏 nav 跳转 */
      var navJumps = {
        'fmm-nav-home': 'page-welcome-setup-mobile.html',
        'fmm-nav-gallery': 'page-exhibition-editor-mobile.html',
        'fmm-nav-create': 'page-archive-card-mobile.html',
        'fmm-nav-visit': 'page-visit-exhibit-mobile.html'
      };
      Object.keys(navJumps).forEach(function(domId){
        document.querySelectorAll('[data-dom-id="'+domId+'"]').forEach(function(el){
          el.addEventListener('click', function(e){ e.preventDefault(); location.href = navJumps[domId]; });
        });
      });
      document.querySelectorAll('[data-dom-id="fmm-nav-mine"]').forEach(function(el){
        el.addEventListener('click', function(e){ e.preventDefault(); alert('个人中心 · 待开发'); });
      });
    });
  })();
  </script>
