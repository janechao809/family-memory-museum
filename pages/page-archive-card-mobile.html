<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>②物品档案卡</title>
    <style id="theme-vars">
@import "tailwindcss";

@custom-variant dark (&:is(.dark *));

:root {
  /* —— 语义表面 —— */
  --background: #F7F2E9;          /* bg.canvas 暖白纸 */
  --foreground: #243A36;          /* text.primary */
  --card: #FFFDF8;                /* bg.surface */
  --card-foreground: #243A36;
  --popover: #FFFDF8;
  --popover-foreground: #243A36;

  /* —— 品牌 / 主操作 —— */
  --primary: #315B50;             /* brand.forest 主按钮/链接 */
  --primary-foreground: #FFFDF8;
  --secondary: #DDE8E2;           /* accent.mist 选中态 */
  --secondary-foreground: #243A36;
  --accent: #D8A84D;              /* accent.mustard 编号/路径节点 */
  --accent-foreground: #243A36;
  --muted: #EFE7D8;
  --muted-foreground: #63736D;    /* text.secondary */

  /* —— 描边 / 输入 / 聚焦 —— */
  --border: #E7DDD0;              /* border.soft */
  --input: #E7DDD0;
  --ring: #315B50;

  /* —— 自定义品牌色（多色相，用户文档显式指定） —— */
  --terracotta: #B86A4A;          /* brand.terracotta 录音/强调 */
  --terracotta-foreground: #FFFDF8;
  --private: #5D6F8B;             /* status.private 私密标记 */
  --private-foreground: #FFFDF8;

  /* —— 图表（低饱和档案感） —— */
  --chart-1: #315B50;
  --chart-2: #B86A4A;
  --chart-3: #D8A84D;
  --chart-4: #5D6F8B;
  --chart-5: #63736D;

  /* —— 侧栏 —— */
  --sidebar: #FFFDF8;
  --sidebar-foreground: #243A36;
  --sidebar-primary: #315B50;
  --sidebar-primary-foreground: #FFFDF8;
  --sidebar-accent: #DDE8E2;
  --sidebar-accent-foreground: #243A36;
  --sidebar-border: #E7DDD0;
  --sidebar-ring: #315B50;

  /* —— 圆角 —— */
  --radius: 16px;
  /* 品牌前缀语义别名（fill-html-head.mjs semantic mapping） */
  --fmm-radius-sm: 12px;
  --fmm-radius-md: 12px;
  --fmm-radius-lg: 16px;
  --fmm-radius-xl: 20px;
  --fmm-radius-2xl: 24px;

  /* —— 字体族 —— */
  --font-serif: "Noto Serif SC", "Songti SC", serif;
  --font-sans: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* —— 语义别名（semantic-token-fallback） —— */
  --semantic-bg-canvas: var(--background);
  --semantic-bg-surface: var(--card);
  --semantic-bg-muted: var(--muted);
  --semantic-text-primary: var(--foreground);
  --semantic-text-secondary: var(--muted-foreground);
  --semantic-text-on-primary: var(--primary-foreground);
  --semantic-brand-forest: var(--primary);
  --semantic-brand-terracotta: var(--terracotta);
  --semantic-accent-mustard: var(--accent);
  --semantic-accent-mist: var(--secondary);
  --semantic-border-soft: var(--border);
  --semantic-status-private: var(--private);
  --semantic-ring: var(--ring);
}

.dark {
  --background: #1E2B27;
  --foreground: #F2EBDC;
  --card: #26332F;
  --card-foreground: #F2EBDC;
  --popover: #26332F;
  --popover-foreground: #F2EBDC;
  --primary: #6FA89B;
  --primary-foreground: #1E2B27;
  --secondary: #3A4A44;
  --secondary-foreground: #F2EBDC;
  --accent: #E0BC6A;
  --accent-foreground: #1E2B27;
  --muted: #313F3A;
  --muted-foreground: #9CA8A2;
  --border: #3A4A44;
  --input: #3A4A44;
  --ring: #6FA89B;
  --terracotta: #D08A68;
  --terracotta-foreground: #1E2B27;
  --private: #8AA0BD;
  --private-foreground: #1E2B27;
  --chart-1: #6FA89B;
  --chart-2: #D08A68;
  --chart-3: #E0BC6A;
  --chart-4: #8AA0BD;
  --chart-5: #9CA8A2;
  --sidebar: #26332F;
  --sidebar-foreground: #F2EBDC;
  --sidebar-primary: #6FA89B;
  --sidebar-primary-foreground: #1E2B27;
  --sidebar-accent: #3A4A44;
  --sidebar-accent-foreground: #F2EBDC;
  --sidebar-border: #3A4A44;
  --sidebar-ring: #6FA89B;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-terracotta: var(--terracotta);
  --color-terracotta-foreground: var(--terracotta-foreground);
  --color-private: var(--private);
  --color-private-foreground: var(--private-foreground);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --font-sans: var(--font-sans);
  --font-serif: var(--font-serif);
  --font-mono: var(--font-mono);

  --radius-sm: calc(var(--radius) - 4px);   /* 12 */
  --radius-md: calc(var(--radius) - 4px);   /* 12 */
  --radius-lg: var(--radius);               /* 16 */
  --radius-xl: calc(var(--radius) + 4px);   /* 20 */
  --radius-2xl: calc(var(--radius) + 8px);  /* 24 浮层专用 */
}

@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, .font-serif {
    font-family: var(--font-serif);
  }
}

<body class="min-h-screen bg-background font-sans antialiased">
  <div class="mx-auto w-full max-w-[420px] min-h-screen bg-background">
    <!-- 极简顶栏：照搬 curator-mobile.html -->
    <header class="sticky top-0 z-30 border-b border-border bg-card/80 backdrop-blur" style="padding-top:env(safe-area-inset-top)">
      <div class="flex items-center justify-between px-5 py-3">
        <span class="font-serif text-base text-foreground">家庭记忆博物馆</span>
        <a href="#" data-dom-id="fmm-nav-mine" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-muted-foreground hover:bg-muted hover:text-foreground">
          <i data-lucide="user" class="h-[18px] w-[18px]"></i>
        </a>
      </div>
    </header>

    <!-- 内容区 main slot：底部留出 fixed nav 高度 + 安全区 -->
    <main id="fmm-page-content" class="min-h-screen bg-background px-5 pb-[calc(72px+env(safe-area-inset-bottom))]">

      <!-- ① 顶部进度条：第 3 / 5 步，5 个 mustard 圆点第 3 个实心 -->
      <section class="pt-5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <button type="button" data-dom-id="fmm-step-back" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-muted-foreground hover:bg-muted hover:text-foreground">
              <i data-lucide="arrow-left" class="h-4 w-4"></i>
            </button>
            <span class="text-[12px] font-medium text-muted-foreground">第 3 / 5 步</span>
          </div>
          <span class="inline-flex items-center gap-1 rounded-full bg-muted px-2.5 py-1 text-[11px] text-muted-foreground">
            <i data-lucide="archive" class="h-3 w-3"></i>建档
          </span>
        </div>
        <!-- 5 个 mustard 圆点：1-2 已完成、3 当前实心带光晕、4-5 待办空心 -->
        <div class="mt-3 flex items-center gap-2">
          <span class="h-2 w-2 rounded-full bg-accent"></span>
          <span class="h-px w-3 bg-accent/40"></span>
          <span class="h-2 w-2 rounded-full bg-accent"></span>
          <span class="h-px w-3 bg-accent/40"></span>
          <span class="relative flex h-3 w-3 items-center justify-center">
            <span class="absolute h-3 w-3 rounded-full bg-accent/25"></span>
            <span class="h-2 w-2 rounded-full bg-accent"></span>
          </span>
          <span class="h-px w-3 bg-border"></span>
          <span class="h-2 w-2 rounded-full border border-accent/50 bg-transparent"></span>
          <span class="h-px w-3 bg-border"></span>
          <span class="h-2 w-2 rounded-full border border-accent/50 bg-transparent"></span>
        </div>
        <h1 class="mt-3 font-serif text-[24px] leading-tight text-foreground">它发生过什么</h1>
        <p class="mt-1.5 text-[13px] leading-relaxed text-muted-foreground">一次只讲一个小片段就够，不必说完所有事。</p>
      </section>

      <!-- 当前策展成员（可切换） -->
      <section class="pt-4">
        <div class="flex items-center gap-2">
          <span class="text-[12px] text-muted-foreground shrink-0">策展成员</span>
          <div class="flex flex-1 gap-1.5">
            <button type="button" data-fmm-role="member-switch" data-member="妈妈" class="flex-1 rounded-full border border-border bg-card px-2 py-1.5 text-[12px] text-muted-foreground">妈妈</button>
            <button type="button" data-fmm-role="member-switch" data-member="外婆" class="flex-1 rounded-full border border-border bg-card px-2 py-1.5 text-[12px] text-muted-foreground">外婆</button>
            <button type="button" data-fmm-role="member-switch" data-member="外公" class="flex-1 rounded-full border border-border bg-card px-2 py-1.5 text-[12px] text-muted-foreground">外公</button>
            <button type="button" data-fmm-role="member-switch" data-member="爸爸" class="flex-1 rounded-full border border-border bg-card px-2 py-1.5 text-[12px] text-muted-foreground">爸爸</button>
            <button type="button" data-fmm-role="member-switch" data-member="孩子" class="flex-1 rounded-full border border-border bg-card px-2 py-1.5 text-[12px] text-muted-foreground">孩子</button>
          </div>
        </div>
      </section>

      <!-- ② 物品缩略图卡：可点击上传/更换照片 -->
      <section class="pt-5">
        <figure data-fmm-role="photo-card" class="relative overflow-hidden rounded-lg border border-border bg-card cursor-pointer">
          <img data-fmm-role="photo-img" src="../assets/exhibit-textbook.jpg" alt="初一数学课本" class="block aspect-[4/3] w-full object-cover" />
          <div data-fmm-role="photo-overlay" class="absolute inset-0 flex items-center justify-center bg-foreground/40 opacity-0 transition-opacity">
            <span class="inline-flex items-center gap-1.5 rounded-full bg-background/90 px-3 py-1.5 text-[13px] font-medium text-foreground"><i data-lucide="camera" class="h-4 w-4"></i>点击上传/更换照片</span>
          </div>
          <input type="file" accept="image/*" data-fmm-role="photo-input" class="hidden" />
          <figcaption class="flex items-center justify-between gap-3 px-4 py-3">
            <div class="min-w-0">
              <p data-fmm-role="exhibit-name" class="font-serif text-[16px] leading-tight text-foreground">初一数学课本</p>
              <p data-fmm-role="exhibit-year" class="mt-0.5 flex items-center gap-1.5 text-[12px] text-muted-foreground">
                <i data-lucide="calendar" class="h-3 w-3"></i>20年代
              </p>
            </div>

        <textarea id="fmm-story-input" class="block min-h-[160px] w-full resize-none rounded-lg border border-border bg-card px-4 py-3 text-[15px] leading-relaxed text-foreground placeholder:text-muted-foreground/70 focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20" placeholder="可以讲一个小片段，不必说完所有事">初一开学那天，妈妈用牛皮纸把这本数学课本包好，在内页写了"慢慢来"三个字。那年我数学跟不上，她每晚陪我重做错题，从没说过"你怎么又错"。</textarea>
      </section>

      <!-- ④ 按住录音键：terracotta 圆形大按钮，松开生成 30 秒语音 -->
      <section class="pt-6">
        <div class="flex flex-col items-center gap-2 rounded-lg border border-border bg-card px-4 py-6">
          <button type="button" data-fmm-role="record" class="flex h-16 w-16 items-center justify-center rounded-full bg-terracotta text-terracotta-foreground shadow-sm transition active:scale-95">

  <script>
  /* fmm-interaction-v2 · 真实功能版 */
(function(){
  function ready(fn){ if(document.readyState!=='loading'){fn();}else{document.addEventListener('DOMContentLoaded',fn);} }
  ready(function(){
    var idx = FMM.currentIdx();
    var ex = FMM.getExhibit(idx);

    /* —— 展品图片资源映射 + 按成员定位展品 —— */
    var ASSET_MAP = { '妈妈':'exhibit-enamel-mug.jpg', '外婆':'exhibit-photo-album.jpg', '外公':'exhibit-fountain-pen.jpg', '爸爸':'exhibit-mechanical-watch.jpg', '孩子':'exhibit-textbook.jpg' };
    function findIdxByOwner(member){
      var d = FMM.load();
      for(var i=0;i<d.exhibits.length;i++){ if(d.exhibits[i].owner === member){ return i; } }
      return -1;
    }

    /* —— 渲染当前展品到档案卡（初始 + 切换成员复用）—— */
    function renderExhibit(){
      var cur = FMM.getExhibit(idx);
      var pImg = document.querySelector('[data-fmm-role="photo-img"]');
      var nEl = document.querySelector('[data-fmm-role="exhibit-name"]');
      var yEl = document.querySelector('[data-fmm-role="exhibit-year"]');
      var nmEl = document.querySelector('[data-fmm-role="exhibit-number"]');
      var sInput = document.getElementById('fmm-story-input');
      var eName = document.querySelector('[data-fmm-role="edit-name"]');
      var eYear = document.querySelector('[data-fmm-role="edit-year"]');
      var eTeller = document.querySelector('[data-fmm-role="edit-teller"]');
      if(pImg){ pImg.src = cur.photo || ('../assets/' + (ASSET_MAP[cur.owner]||'exhibit-textbook.jpg')); pImg.alt = cur.name||''; }
      if(nEl){ nEl.textContent = cur.name||''; }
      if(yEl){ yEl.innerHTML = '<i data-lucide="calendar" class="h-3 w-3"></i>'+(cur.year||''); }
      if(nmEl){ nmEl.innerHTML = '<i data-lucide="hash" class="h-3 w-3"></i>'+(cur.owner||'')+'—'+(cur.number||''); }
      if(sInput){ sInput.value = cur.story||''; }
      if(eName){ eName.value = cur.name||''; }
      if(eYear){ eYear.value = cur.year||''; }
      if(eTeller){ eTeller.value = cur.teller||''; }
      /* 情绪标签同步 */
      savedEmotions = (cur.emotion||[]).slice();
      document.querySelectorAll('button').forEach(function(btn){
        var t=(btn.textContent||'').replace(/\s+/g,'');
        if(words.indexOf(t)===-1){ return; }
        if(savedEmotions.indexOf(t)!==-1){ inactive.forEach(function(c){btn.classList.remove(c);}); active.forEach(function(c){btn.classList.add(c);}); }
        else { active.forEach(function(c){btn.classList.remove(c);}); inactive.forEach(function(c){btn.classList.add(c);}); }
      });
      if(window.lucide){ lucide.createIcons(); }
    }

    /* —— 当前策展成员切换（所有家庭成员均可策展）—— */
    var memberSwitchBtns = document.querySelectorAll('[data-fmm-role="member-switch"]');
    var mData = FMM.load();
    var curMember = (mData && mData.museum && mData.museum.identity) ? mData.museum.identity : '妈妈';
    /* 若 identity 对应某成员，则同步到该成员的展品 */
    var syncIdx = findIdxByOwner(curMember);
    if(syncIdx !== -1){ idx = syncIdx; FMM.setCurrentIdx(idx); ex = FMM.getExhibit(idx); }
    function setActiveMember(member){
      memberSwitchBtns.forEach(function(b){
        var m = b.getAttribute('data-member');
        if(m === member){
          b.classList.add('border-primary','bg-secondary','text-primary');
          b.classList.remove('border-border','bg-card','text-muted-foreground');
        } else {
          b.classList.remove('border-primary','bg-secondary','text-primary');
          b.classList.add('border-border','bg-card','text-muted-foreground');
        }
      });
    }
    setActiveMember(curMember);
    memberSwitchBtns.forEach(function(b){
      b.addEventListener('click', function(){
        var member = b.getAttribute('data-member');
        var d = FMM.load(); d.museum.identity = member; FMM.save(d);
        var ni = findIdxByOwner(member);
        if(ni !== -1){ idx = ni; FMM.setCurrentIdx(idx); }
        setActiveMember(member);
        renderExhibit();
      });
    });

    /* —— 照片上传：点击图卡 → 选图 → FileReader 预览 + 存 base64 —— */
    var photoCard = document.querySelector('[data-fmm-role="photo-card"]');
    var photoImg = document.querySelector('[data-fmm-role="photo-img"]');
    var photoInput = document.querySelector('[data-fmm-role="photo-input"]');
    var photoOverlay = document.querySelector('[data-fmm-role="photo-overlay"]');
    /* 照片保存成功视觉反馈：边框闪烁绿色 + 显示"已保存"提示 */
    function showPhotoSaved(card){
      if(!card) return;
      card.style.transition = 'box-shadow .3s ease';
      card.style.boxShadow = '0 0 0 3px #315B50';
      var badge = document.createElement('div');
      badge.textContent = '已保存';
      badge.style.cssText = 'position:absolute;top:8px;right:8px;background:#315B50;color:#FFFDF8;padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:500;z-index:10;opacity:0;transition:opacity .3s ease;';
      card.appendChild(badge);
      setTimeout(function(){ badge.style.opacity = '1'; }, 10);
      setTimeout(function(){
        card.style.boxShadow = '';
        badge.style.opacity = '0';
        setTimeout(function(){ if(badge.parentNode){ badge.parentNode.removeChild(badge); } }, 300);
      }, 1500);
    }
    if(photoCard && photoInput && photoImg){
      /* 恢复已存照片 */
      if(ex.photo){ photoImg.src = ex.photo; }
      photoCard.addEventListener('mouseenter', function(){ if(photoOverlay){ photoOverlay.style.opacity='1'; }});
      photoCard.addEventListener('mouseleave', function(){ if(photoOverlay){ photoOverlay.style.opacity='0'; }});
      photoCard.addEventListener('click', function(){ photoInput.click(); });
      photoInput.addEventListener('change', function(){
        var file = photoInput.files && photoInput.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          var rawUrl = e.target.result;
          /* 先用原图预览，压缩后替换并持久化 */
          photoImg.src = rawUrl;
          FMM.compressImage(rawUrl, 800, 0.72, function(dataUrl){
            photoImg.src = dataUrl;
            /* 持久化压缩后照片到当前展品 */
            FMM.setExhibit(idx, { photo: dataUrl });
            /* 保存成功视觉反馈 */
            showPhotoSaved(photoCard);
          });
        };
        reader.readAsDataURL(file);
      });
    }

    /* —— 文本框持久化 —— */
    var storyInput = document.getElementById('fmm-story-input');
    if(storyInput){
      if(ex.story){ storyInput.value = ex.story; }
      storyInput.addEventListener('input', function(){
        FMM.setExhibit(idx, { story: storyInput.value });
      });
    }

    /* —— 物品名 / 年代 / 讲述者 可编辑输入框持久化 —— */
    var nameInput = document.querySelector('[data-fmm-role="edit-name"]');
    var yearInput = document.querySelector('[data-fmm-role="edit-year"]');
    var tellerInput = document.querySelector('[data-fmm-role="edit-teller"]');
    if(nameInput){
      nameInput.value = ex.name || '';
      nameInput.addEventListener('input', function(){
        FMM.setExhibit(idx, { name: nameInput.value });
        var nEl = document.querySelector('[data-fmm-role="exhibit-name"]');
        if(nEl){ nEl.textContent = nameInput.value; }
        var pImg = document.querySelector('[data-fmm-role="photo-img"]');
        if(pImg){ pImg.alt = nameInput.value; }
      });
    }
    if(yearInput){
      yearInput.value = ex.year || '';
      yearInput.addEventListener('input', function(){
        FMM.setExhibit(idx, { year: yearInput.value });
        var yEl = document.querySelector('[data-fmm-role="exhibit-year"]');
        if(yEl){ yEl.innerHTML = '<i data-lucide="calendar" class="h-3 w-3"></i>'+(yearInput.value); }
      });
    }
    if(tellerInput){
      tellerInput.value = ex.teller || '';
      tellerInput.addEventListener('input', function(){
        FMM.setExhibit(idx, { teller: tellerInput.value });
      });
    }

    /* —— 情绪标签：多选 + 持久化 —— */
    var words = ['陪伴','愧疚','安心','想念','遗憾','温暖'];
    var active = ['border-primary','bg-secondary','text-primary'];
    var inactive = ['border-border','bg-card','text-muted-foreground'];
    var savedEmotions = ex.emotion || [];
    document.querySelectorAll('button').forEach(function(btn){
      var t = (btn.textContent||'').replace(/\s+/g,'');
      if(words.indexOf(t) === -1){ return; }
      if(savedEmotions.indexOf(t) !== -1){
        inactive.forEach(function(c){ btn.classList.remove(c); });
        active.forEach(function(c){ btn.classList.add(c); });
      }
      btn.addEventListener('click', function(){
        var isOn = btn.classList.contains('border-primary');
        if(isOn){
          active.forEach(function(c){ btn.classList.remove(c); });
          inactive.forEach(function(c){ btn.classList.add(c); });
          savedEmotions = savedEmotions.filter(function(w){ return w !== t; });
        } else {
          inactive.forEach(function(c){ btn.classList.remove(c); });
          active.forEach(function(c){ btn.classList.add(c); });
          if(savedEmotions.indexOf(t) === -1){ savedEmotions.push(t); }
        }
        FMM.setExhibit(idx, { emotion: savedEmotions });
      });
    });

    /* —— 真实录音：MediaRecorder + click 切换 —— */
    var rec = document.querySelector('[data-fmm-role="record"]');
    if(rec){
      var statusEl = rec.parentElement.querySelector('p.text-\\[14px\\]') || rec.parentElement.querySelectorAll('p')[0];
      var hintEl = rec.parentElement.querySelectorAll('p')[1];
      var recording = false;
      var mediaRecorder = null;
      var audioChunks = [];
      rec.addEventListener('click', function(){
        if(recording){
          /* 停止录音 */
          if(mediaRecorder && mediaRecorder.state !== 'inactive'){ mediaRecorder.stop(); }
          recording = false;
          rec.style.backgroundColor = '';
          rec.style.transform = '';
          rec.style.boxShadow = '';
          if(statusEl){ statusEl.textContent = '已录制'; }
          if(hintEl){ hintEl.innerHTML = '<i data-lucide="check" class="h-3 w-3 text-primary"></i>点击重新录制'; if(window.lucide){lucide.createIcons();} }
          return;
        }
        /* 开始录音 */
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
          alert('当前浏览器不支持录音功能，请使用 Chrome/Safari/Edge。');
          return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
          recording = true;
          /* 录音时停止背景音乐，确保录音清晰 */
          if(typeof FMM !== 'undefined' && FMM.music && FMM.music.isPlaying()){ FMM.music.stop(); }
          audioChunks = [];
          try { mediaRecorder = new MediaRecorder(stream); }
          catch(e){ alert('录音初始化失败：' + e.message); stream.getTracks().forEach(function(t){t.stop();}); recording=false; return; }
          mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size > 0){ audioChunks.push(e.data); } };
          mediaRecorder.onstop = function(){
            var blob = new Blob(audioChunks, { type: 'audio/webm' });
            var reader = new FileReader();
            reader.onloadend = function(){
              var audioUrl = reader.result;
              if(audioUrl.length < 5*1024*1024){ FMM.setExhibit(idx, { audio: audioUrl }); }
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(function(t){ t.stop(); });
            /* 录音结束后恢复背景音乐（如果之前在播放） */
            if(typeof FMM !== 'undefined' && FMM.music && FMM.music.shouldPlay()){ setTimeout(function(){ FMM.music.tryRestore(); }, 500); }
          };
          mediaRecorder.start();
          rec.style.backgroundColor = '#dc2626';
          rec.style.transform = 'scale(1.1)';
          rec.style.boxShadow = '0 0 0 4px rgba(220,38,38,0.2)';
          if(statusEl){ statusEl.textContent = '正在录音… 点击停止'; }
        }).catch(function(err){
          alert('无法访问麦克风：' + (err.message || err.name) + '\n请在浏览器设置中允许麦克风权限。');
        });
      });
    }

    /* —— 回听播放：播放已录制的音频 —— */
    var playBtn = document.querySelector('[data-fmm-role="playback"]');
    if(playBtn){
      var playIcon = playBtn.querySelector('i, svg');
      var playLabel = playBtn.querySelector('span');
      var playAudioEl = null;
      playBtn.addEventListener('click', function(){
        var curEx = FMM.getExhibit(idx);
        if(!curEx.audio){
          alert('还没有录音，请先录音。');
          return;
        }
        /* 正在播放 → 暂停 */
        if(playAudioEl && !playAudioEl.paused){
          playAudioEl.pause();
          if(playIcon){ var ni=document.createElement('i'); ni.setAttribute('data-lucide','play'); ni.className='h-4 w-4'; playIcon.parentNode.replaceChild(ni,playIcon); playIcon=ni; if(window.lucide){lucide.createIcons();} }
          if(playLabel){ playLabel.textContent = '回听录音'; }
          return;
        }
        /* 播放 */
        if(!playAudioEl){ playAudioEl = new Audio(curEx.audio); }
        else { playAudioEl.src = curEx.audio; }
        playAudioEl.play().then(function(){
          if(playIcon){ var ni2=document.createElement('i'); ni2.setAttribute('data-lucide','pause'); ni2.className='h-4 w-4'; playIcon.parentNode.replaceChild(ni2,playIcon); playIcon=ni2; if(window.lucide){lucide.createIcons();} }
          if(playLabel){ playLabel.textContent = '暂停'; }
        }).catch(function(){ alert('播放失败，请重试。'); });
        playAudioEl.onended = function(){
          if(playIcon){ var ni3=document.createElement('i'); ni3.setAttribute('data-lucide','play'); ni3.className='h-4 w-4'; playIcon.parentNode.replaceChild(ni3,playIcon); playIcon=ni3; if(window.lucide){lucide.createIcons();} }
          if(playLabel){ playLabel.textContent = '回听录音'; }
        };
      });
    }

    /* —— 返回按钮：保存全部字段后返回上一页 —— */
    var saveDraftBtn = document.querySelector('[data-dom-id="fmm-save-draft"]');
    if(saveDraftBtn){
      saveDraftBtn.addEventListener('click', function(){
        FMM.setExhibit(idx, {
          story: storyInput.value,
          emotion: savedEmotions.slice(),
          name: nameInput ? nameInput.value : (ex.name||''),
          year: yearInput ? yearInput.value : (ex.year||''),
          teller: tellerInput ? tellerInput.value : (ex.teller||''),
          saved: true
        });
        location.href = 'page-welcome-setup-mobile.html';
      });
    }

    /* —— 保存按钮：保存全部字段，不跳转，显示反馈 —— */
    var saveInfoBtn = document.querySelector('[data-dom-id="fmm-save-info"]');
    if(saveInfoBtn){
      saveInfoBtn.addEventListener('click', function(){
        FMM.setExhibit(idx, {
          story: storyInput.value,
          emotion: savedEmotions.slice(),
          name: nameInput ? nameInput.value : (ex.name||''),
          year: yearInput ? yearInput.value : (ex.year||''),
          teller: tellerInput ? tellerInput.value : (ex.teller||''),
          saved: true
        });
        var orig = saveInfoBtn.textContent;
        saveInfoBtn.textContent = '已保存 ✓';
        saveInfoBtn.style.backgroundColor = '#315B50';
        saveInfoBtn.style.color = '#FFFDF8';
        saveInfoBtn.style.borderColor = '#315B50';
        setTimeout(function(){
          saveInfoBtn.textContent = orig;
          saveInfoBtn.style.backgroundColor = '';
          saveInfoBtn.style.color = '';
          saveInfoBtn.style.borderColor = '';
        }, 2000);
      });
    }

    /* —— 跳转 —— */
    var nextBtn = document.querySelector('[data-dom-id="fmm-step-next"]');
    if(nextBtn){ nextBtn.addEventListener('click', function(){
      FMM.setExhibit(idx, {
        story: storyInput.value,
        emotion: savedEmotions.slice(),
        name: nameInput ? nameInput.value : (ex.name||''),
        year: yearInput ? yearInput.value : (ex.year||''),
        teller: tellerInput ? tellerInput.value : (ex.teller||''),
        saved: true
      });
      location.href = 'page-exhibition-editor-mobile.html';
    }); }
    var navJumps = {
      'fmm-nav-home': 'page-welcome-setup-mobile.html',
      'fmm-nav-gallery': 'page-exhibition-editor-mobile.html',
      'fmm-nav-create': 'page-archive-card-mobile.html',
      'fmm-nav-visit': 'page-visit-exhibit-mobile.html'
    };
    Object.keys(navJumps).forEach(function(domId){
      document.querySelectorAll('[data-dom-id="'+domId+'"]').forEach(function(el){
        el.addEventListener('click', function(e){ e.preventDefault(); location.href = navJumps[domId]; });
      });
    });
    document.querySelectorAll('[data-dom-id="fmm-nav-mine"]').forEach(function(el){
      el.addEventListener('click', function(e){ e.preventDefault(); location.href = 'page-mine-mobile.html'; });
    });
    renderExhibit();
    if(window.lucide){ lucide.createIcons(); }
  });
})();
  </script>
</body>
</html>
