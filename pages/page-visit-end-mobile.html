<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⑦观众便签与结束页</title>
    <style id="theme-vars">
@import "tailwindcss";

@custom-variant dark (&:is(.dark *));

:root {
  /* —— 语义表面 —— */
  --background: #F7F2E9;          /* bg.canvas 暖白纸 */
  --foreground: #243A36;          /* text.primary */
  --card: #FFFDF8;                /* bg.surface */
  --card-foreground: #243A36;
  --popover: #FFFDF8;
  --popover-foreground: #243A36;

  /* —— 品牌 / 主操作 —— */
  --primary: #315B50;             /* brand.forest 主按钮/链接 */
  --primary-foreground: #FFFDF8;
  --secondary: #DDE8E2;           /* accent.mist 选中态 */
  --secondary-foreground: #243A36;
  --accent: #D8A84D;              /* accent.mustard 编号/路径节点 */
  --accent-foreground: #243A36;
  --muted: #EFE7D8;
  --muted-foreground: #63736D;    /* text.secondary */

  /* —— 描边 / 输入 / 聚焦 —— */
  --border: #E7DDD0;              /* border.soft */
  --input: #E7DDD0;
  --ring: #315B50;

  /* —— 自定义品牌色（多色相，用户文档显式指定） —— */
  --terracotta: #B86A4A;          /* brand.terracotta 录音/强调 */
  --terracotta-foreground: #FFFDF8;
  --private: #5D6F8B;             /* status.private 私密标记 */
  --private-foreground: #FFFDF8;

  /* —— 图表（低饱和档案感） —— */
  --chart-1: #315B50;
  --chart-2: #B86A4A;
  --chart-3: #D8A84D;
  --chart-4: #5D6F8B;
  --chart-5: #63736D;

  /* —— 侧栏 —— */
  --sidebar: #FFFDF8;
  --sidebar-foreground: #243A36;
  --sidebar-primary: #315B50;
  --sidebar-primary-foreground: #FFFDF8;
  --sidebar-accent: #DDE8E2;
  --sidebar-accent-foreground: #243A36;
  --sidebar-border: #E7DDD0;
  --sidebar-ring: #315B50;

  /* —— 圆角 —— */
  --radius: 16px;
  /* 品牌前缀语义别名（fill-html-head.mjs semantic mapping） */
  --fmm-radius-sm: 12px;
  --fmm-radius-md: 12px;
  --fmm-radius-lg: 16px;
  --fmm-radius-xl: 20px;
  --fmm-radius-2xl: 24px;

  /* —— 字体族 —— */
  --font-serif: "Noto Serif SC", "Songti SC", serif;
  --font-sans: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* —— 语义别名（semantic-token-fallback） —— */
  --semantic-bg-canvas: var(--background);
  --semantic-bg-surface: var(--card);
  --semantic-bg-muted: var(--muted);
  --semantic-text-primary: var(--foreground);
  --semantic-text-secondary: var(--muted-foreground);
  --semantic-text-on-primary: var(--primary-foreground);
  --semantic-brand-forest: var(--primary);
  --semantic-brand-terracotta: var(--terracotta);
  --semantic-accent-mustard: var(--accent);
  --semantic-accent-mist: var(--secondary);
  --semantic-border-soft: var(--border);
  --semantic-status-private: var(--private);
  --semantic-ring: var(--ring);
}

.dark {
  --background: #1E2B27;
  --foreground: #F2EBDC;
  --card: #26332F;
  --card-foreground: #F2EBDC;
  --popover: #26332F;
  --popover-foreground: #F2EBDC;
  --primary: #6FA89B;
  --primary-foreground: #1E2B27;
  --secondary: #3A4A44;
  --secondary-foreground: #F2EBDC;
  --accent: #E0BC6A;
  --accent-foreground: #1E2B27;
  --muted: #313F3A;
  --muted-foreground: #9CA8A2;
  --border: #3A4A44;
  --input: #3A4A44;
  --ring: #6FA89B;
  --terracotta: #D08A68;
  --terracotta-foreground: #1E2B27;
  --private: #8AA0BD;
  --private-foreground: #1E2B27;
  --chart-1: #6FA89B;
  --chart-2: #D08A68;
  --chart-3: #E0BC6A;
  --chart-4: #8AA0BD;
  --chart-5: #9CA8A2;
  --sidebar: #26332F;
  --sidebar-foreground: #F2EBDC;
  --sidebar-primary: #6FA89B;
  --sidebar-primary-foreground: #1E2B27;
  --sidebar-accent: #3A4A44;
  --sidebar-accent-foreground: #F2EBDC;
  --sidebar-border: #3A4A44;
  --sidebar-ring: #6FA89B;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-terracotta: var(--terracotta);
  --color-terracotta-foreground: var(--terracotta-foreground);
  --color-private: var(--private);
  --color-private-foreground: var(--private-foreground);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --font-sans: var(--font-sans);
  --font-serif: var(--font-serif);
  --font-mono: var(--font-mono);

  --radius-sm: calc(var(--radius) - 4px);   /* 12 */
  --radius-md: calc(var(--radius) - 4px);   /* 12 */
  --radius-lg: var(--radius);               /* 16 */
  --radius-xl: calc(var(--radius) + 4px);   /* 20 */
  --radius-2xl: calc(var(--radius) + 8px);  /* 24 浮层专用 */
}

@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, .font-serif {
    font-family: var(--font-serif);
  }
}

<body class="min-h-screen bg-background font-sans antialiased">
  <div class="mx-auto w-full max-w-[420px] min-h-screen bg-background">
    <!--
      移动观众沉浸式 shell（document-scroll）·派生自 ⑥
      - 极简顶栏：左"← 退出"(fmm-exit-visit) + 中展览名"一件物品里的陪伴"宋体 + 右路线进度"4 / 4"(fmm-visit-progress)
      - 满宽内容区 main slot：便签输入 / 已留便签 / 结束提问 / 策展人反思
      - 无底部 nav（沉浸式收束）
      - 底部 sticky 浮层：单一"完成参观"主按钮（替代 ⑥ 的语音胶囊 + 下一站）
    -->
    <header class="sticky top-0 z-30 border-b border-border bg-card/80 backdrop-blur" style="padding-top:env(safe-area-inset-top)">
      <div class="flex items-center justify-between px-5 py-3">
        <a data-dom-id="fmm-exit-visit" class="inline-flex items-center gap-1 text-sm text-muted-foreground hover:text-foreground">
          <i data-lucide="arrow-left" class="h-4 w-4"></i>退出
        </a>
        <span class="font-serif text-base text-foreground">一件物品里的陪伴</span>
        <span data-dom-id="fmm-visit-progress" class="text-sm text-muted-foreground">4 / 4</span>
      </div>
    </header>

    <!-- 满宽内容区 main slot，无底部 nav；底部留出悬浮"完成参观"按钮空间 -->
    <main id="fmm-page-content" class="min-h-screen bg-background" style="padding-bottom:calc(96px + env(safe-area-inset-bottom))">

      <!-- ① 顶部小标 + 宋体大标题：展览收束提问 -->
      <section class="px-5 pt-6">
        <p class="text-[12px] tracking-wide text-muted-foreground">展览到这里</p>
        <h1 class="mt-1.5 font-serif text-[24px] leading-tight text-foreground">这件物品为什么值得被留下？</h1>
      </section>

      <!-- ② 便签输入卡：bg-card border rounded-lg p-4 -->
      <section class="px-5 pt-5">
        <div data-dom-id="fmm-note-input" class="rounded-lg border border-border bg-card p-4">
          <div class="flex items-center gap-2">
            <i data-lucide="sticky-note" class="h-4 w-4 text-muted-foreground"></i>
            <h2 class="font-serif text-[16px] text-foreground">留下一张便签</h2>
          </div>
          <p class="mt-1 text-[12px] leading-relaxed text-muted-foreground">不评价、不点赞，只让看见被看见。</p>

          <div class="mt-3 space-y-3">
            <!-- 我看见了 -->
            <div>
              <label class="text-[13px] font-medium text-foreground">我看见了</label>
              <textarea rows="2" placeholder="一只缺了口的杯子，和三十年没换的人" class="mt-1.5 block w-full resize-none rounded-lg border border-border bg-background px-3 py-2.5 text-[14px] leading-relaxed text-foreground placeholder:text-muted-foreground/70 focus:border-primary/50 focus:outline-none focus:ring-2 focus:ring-primary/20"></textarea>
            </div>
            <!-- 我想知道 -->
            <div>
              <label class="text-[13px] font-medium text-foreground">我想知道</label>
              <textarea rows="2" placeholder="外婆现在还用它喝水吗？" class="mt-1.5 block w-full resize-none rounded-lg border border-border bg-background px-3 py-2.5 text-[14px] leading-relaxed text-foreground placeholder:text-muted-foreground/70 focus:border-primary/50 focus:outline-none focus:ring-2 focus:ring-primary/20"></textarea>
            </div>
          </div>

          <button data-dom-id="fmm-note-submit" type="button" class="mt-3 inline-flex w-full items-center justify-center gap-1.5 rounded-lg bg-primary px-5 py-2.5 text-[14px] font-medium text-primary-foreground transition active:opacity-90">
            <i data-lucide="plus" class="h-4 w-4"></i>贴上便签
          </button>
        </div>
      </section>

      <!-- ③ 已留便签竖列：mist/secondary 色便签感，错落微旋转 -->
      <section class="px-5 pt-6">
        <div class="flex items-center gap-2">
          <i data-lucide="messages-square" class="h-4 w-4 text-muted-foreground"></i>
          <h2 class="font-serif text-[15px] text-muted-foreground">已留下的便签</h2>
        </div>

        <div data-dom-id="fmm-notes-list" class="mt-3 space-y-3">
          <!-- 便签 1 -->
          <article class="rounded-lg border border-border bg-secondary/60 p-4" style="transform:rotate(-0.6deg)">
            <p class="text-[11px] font-medium uppercase tracking-wide text-muted-foreground">我看见了</p>
            <p class="mt-1 font-serif text-[15px] leading-relaxed text-foreground">一只缺了口的杯子，和三十年没换的人。</p>
          </article>

          <!-- 便签 2 -->
          <article class="rounded-lg border border-border bg-secondary/50 p-4" style="transform:rotate(0.8deg)">
            <p class="text-[11px] font-medium uppercase tracking-wide text-muted-foreground">我想知道</p>
            <p class="mt-1 font-serif text-[15px] leading-relaxed text-foreground">外婆现在还用它喝水吗？</p>
          </article>

          <!-- 便签 3 -->
          <article class="rounded-lg border border-border bg-secondary/60 p-4" style="transform:rotate(-0.4deg)">
            <p class="text-[11px] font-medium uppercase tracking-wide text-muted-foreground">我看见了</p>
            <p class="mt-1 font-serif text-[15px] leading-relaxed text-foreground">三十年冒白气的清晨。</p>
          </article>

          <!-- 便签 4 -->
          <article class="rounded-lg border border-border bg-secondary/50 p-4" style="transform:rotate(0.5deg)">
            <p class="text-[11px] font-medium uppercase tracking-wide text-muted-foreground">我想知道</p>
            <p class="mt-1 font-serif text-[15px] leading-relaxed text-foreground">缺口会不会有一天，也变成被记住的部分。</p>
          </article>
        </div>
      </section>

      <!-- ④ 结束提问卡：mustard 细边 bg-card -->
      <section data-dom-id="fmm-final-answer" class="px-5 pt-6">
        <div class="rounded-lg border border-accent/70 bg-card p-4">
          <div class="flex items-center gap-2">
            <i data-lucide="quote" class="h-4 w-4" style="color:var(--accent)"></i>
            <h2 class="font-serif text-[16px] text-foreground">一句话回答</h2>
          </div>
          <p class="mt-2 font-serif text-[17px] leading-relaxed text-foreground">这件物品为什么值得被留下？</p>

          <!-- 示例回答：font-serif 引文 -->
          <div class="mt-3 rounded-lg border border-border bg-background px-3 py-2.5">
            <p class="font-serif text-[15px] leading-relaxed text-foreground">“因为它不是一件东西，是一段还在继续的时间。”</p>
            <p class="mt-1.5 text-[11px] text-muted-foreground">— 一位参观者</p>
          </div>
        </div>
      </section>

      <!-- ⑤ 策展人反思入口卡：bg-card border rounded-lg -->
      <section class="px-5 pt-5">
        <div class="rounded-lg border border-border bg-card p-4">
          <div class="flex items-center gap-2">
            <i data-lucide="compass" class="h-4 w-4 text-muted-foreground"></i>
            <h2 class="font-serif text-[16px] text-foreground">策展人反思</h2>
          </div>
          <p class="mt-2 text-[14px] leading-relaxed text-foreground">我的策展让观众看见了什么？又遗漏了什么？</p>
          <a data-dom-id="fmm-curator-reflect" class="mt-3 inline-flex w-full items-center justify-center gap-1.5 rounded-lg border border-border bg-background px-5 py-2.5 text-[14px] font-medium text-foreground transition active:opacity-90">
            进入反思
            <i data-lucide="arrow-right" class="h-4 w-4"></i>
          </a>
        </div>
      </section>

      <!-- ⑥ 收束语 -->
      <section class="px-5 pt-6 pb-2">
        <p class="text-center font-serif text-[13px] leading-relaxed text-muted-foreground">谢谢你愿意停下来看。</p>
      </section>

    </main>

    <!-- ⑦ 底部 sticky 浮层：完成参观（替代 ⑥ 的语音胶囊 + 下一站，保留退出入口） -->
    <div class="fixed inset-x-0 bottom-0 z-40" style="padding-bottom:env(safe-area-inset-bottom)">
      <div class="mx-auto w-full max-w-[420px] px-4 pb-3">
        <button data-dom-id="fmm-finish-visit" type="button" class="flex w-full items-center justify-center gap-1.5 rounded-2xl border border-border bg-primary px-5 py-3 text-[15px] font-medium text-primary-foreground shadow-lg transition active:opacity-90">
          <i data-lucide="check" class="h-4 w-4"></i>完成参观
        </button>
      </div>
    </div>

  </div>

  <script>if(window.lucide){lucide.createIcons();}</script>
  <script src="../assets/fmm-app.js"></script>
  <script>
  (function(){
    function ready(fn){
      if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', fn); }
      else { fn(); }
    }
    ready(function(){
      var FMM = window.FMM;
      var labels = ['我看见了','我想知道'];

      /* 已留便签列表：加载时从 FMM.load().notes 动态渲染（替换静态占位） */
      var notesContainer = document.querySelector('[data-dom-id="fmm-notes-list"]');
      function renderNote(note){
        var art = document.createElement('article');
        art.className = 'rounded-lg border border-border bg-secondary/60 p-4';
        art.style.transform = 'rotate(' + (Math.random()*1.6-0.8).toFixed(2) + 'deg)';
        var lbl = document.createElement('p');
        lbl.className = 'text-[11px] font-medium uppercase tracking-wide text-muted-foreground';
        lbl.textContent = (note && note.type) ? note.type : '便签';
        var txt = document.createElement('p');
        txt.className = 'mt-1 font-serif text-[15px] leading-relaxed text-foreground';
        txt.textContent = (note && note.text) ? note.text : '';
        art.appendChild(lbl); art.appendChild(txt);
        return art;
      }
      function renderAllNotes(){
        if(!notesContainer) return;
        notesContainer.innerHTML = '';
        var data = FMM ? FMM.load() : null;
        var notes = (data && data.notes) ? data.notes : [];
        notes.forEach(function(note){ notesContainer.appendChild(renderNote(note)); });
      }
      renderAllNotes();

      /* 便签提交：两个 textarea 非空 → FMM.addNote + 动态插入便签 */
      var submitBtn = document.querySelector('[data-dom-id="fmm-note-submit"]');
      var inputCard = document.querySelector('[data-dom-id="fmm-note-input"]');
      if(submitBtn && inputCard){
        var textareas = inputCard.querySelectorAll('textarea');
        submitBtn.addEventListener('click', function(){
          var added = false;
          for(var i=0;i<textareas.length;i++){
            var ta = textareas[i];
            var val = (ta.value || '').trim();
            if(val){
              FMM.addNote(labels[i] || '便签', val);
              if(notesContainer){
                var data = FMM.load();
                var notes = (data && data.notes) ? data.notes : [];
                var last = notes[notes.length-1];
                if(last){ notesContainer.appendChild(renderNote(last)); }
              }
              ta.value = '';
              added = true;
            }
          }
          if(added && window.lucide){ lucide.createIcons(); }
        });
      }

      /* 策展人反思 */
      var reflectBtn = document.querySelector('[data-dom-id="fmm-curator-reflect"]');
      if(reflectBtn){
        reflectBtn.addEventListener('click', function(){
          alert('反思：我的策展让观众看见了什么？又遗漏了什么？');
        });
      }

      /* 跳转兜底 */
      var jumps = {
        'fmm-finish-visit': 'page-welcome-setup-mobile.html',
        'fmm-exit-visit': 'page-welcome-setup-mobile.html'
      };
      Object.keys(jumps).forEach(function(domId){
        var el = document.querySelector('[data-dom-id="'+domId+'"]');
        if(el){ el.addEventListener('click', function(){ location.href = jumps[domId]; }); }
      });
    });
  })();
  </script>
</body>
</html>
