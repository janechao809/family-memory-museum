<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 · 家记忆博物馆</title>
    <style id="theme-vars">
@import "tailwindcss";

@custom-variant dark (&:is(.dark *));

:root {
  /* —— 语义表面 —— */
  --background: #F7F2E9;          /* bg.canvas 暖白纸 */
  --foreground: #243A36;          /* text.primary */
  --card: #FFFDF8;                /* bg.surface */
  --card-foreground: #243A36;
  --popover: #FFFDF8;
  --popover-foreground: #243A36;

  /* —— 品牌 / 主操作 —— */
  --primary: #315B50;             /* brand.forest 主按钮/链接 */
  --primary-foreground: #FFFDF8;
  --secondary: #DDE8E2;           /* accent.mist 选中态 */
  --secondary-foreground: #243A36;
  --accent: #D8A84D;              /* accent.mustard 编号/路径节点 */
  --accent-foreground: #243A36;
  --muted: #EFE7D8;
  --muted-foreground: #63736D;    /* text.secondary */

  /* —— 描边 / 输入 / 聚焦 —— */
  --border: #E7DDD0;              /* border.soft */
  --input: #E7DDD0;
  --ring: #315B50;

  /* —— 自定义品牌色（多色相，用户文档显式指定） —— */
  --terracotta: #B86A4A;          /* brand.terracotta 录音/强调 */
  --terracotta-foreground: #FFFDF8;
  --private: #5D6F8B;             /* status.private 私密标记 */
  --private-foreground: #FFFDF8;

  /* —— 图表（低饱和档案感） —— */
  --chart-1: #315B50;
  --chart-2: #B86A4A;
  --chart-3: #D8A84D;
  --chart-4: #5D6F8B;
  --chart-5: #63736D;

  /* —— 侧栏 —— */
  --sidebar: #FFFDF8;
  --sidebar-foreground: #243A36;
  --sidebar-primary: #315B50;
  --sidebar-primary-foreground: #FFFDF8;
  --sidebar-accent: #DDE8E2;
  --sidebar-accent-foreground: #243A36;
  --sidebar-border: #E7DDD0;
  --sidebar-ring: #315B50;

  /* —— 圆角 —— */
  --radius: 16px;
  /* 品牌前缀语义别名（fill-html-head.mjs semantic mapping） */
  --fmm-radius-sm: 12px;
  --fmm-radius-md: 12px;
  --fmm-radius-lg: 16px;
  --fmm-radius-xl: 20px;
  --fmm-radius-2xl: 24px;

  /* —— 字体族 —— */
  --font-serif: "Noto Serif SC", "Songti SC", serif;
  --font-sans: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* —— 语义别名（semantic-token-fallback） —— */
  --semantic-bg-canvas: var(--background);
  --semantic-bg-surface: var(--card);
  --semantic-bg-muted: var(--muted);
  --semantic-text-primary: var(--foreground);
  --semantic-text-secondary: var(--muted-foreground);
  --semantic-text-on-primary: var(--primary-foreground);
  --semantic-brand-forest: var(--primary);
  --semantic-brand-terracotta: var(--terracotta);
  --semantic-accent-mustard: var(--accent);
  --semantic-accent-mist: var(--secondary);
  --semantic-border-soft: var(--border);
  --semantic-status-private: var(--private);
  --semantic-ring: var(--ring);
}

.dark {
  --background: #1E2B27;
  --foreground: #F2EBDC;
  --card: #26332F;
  --card-foreground: #F2EBDC;
  --popover: #26332F;
  --popover-foreground: #F2EBDC;
  --primary: #6FA89B;
  --primary-foreground: #1E2B27;
  --secondary: #3A4A44;
  --secondary-foreground: #F2EBDC;
  --accent: #E0BC6A;
  --accent-foreground: #1E2B27;
  --muted: #313F3A;
  --muted-foreground: #9CA8A2;
  --border: #3A4A44;
  --input: #3A4A44;
  --ring: #6FA89B;
  --terracotta: #D08A68;
  --terracotta-foreground: #1E2B27;
  --private: #8AA0BD;
  --private-foreground: #1E2B27;
  --chart-1: #6FA89B;
  --chart-2: #D08A68;
  --chart-3: #E0BC6A;
  --chart-4: #8AA0BD;
  --chart-5: #9CA8A2;
  --sidebar: #26332F;
  --sidebar-foreground: #F2EBDC;
  --sidebar-primary: #6FA89B;
  --sidebar-primary-foreground: #1E2B27;
  --sidebar-accent: #3A4A44;
  --sidebar-accent-foreground: #F2EBDC;
  --sidebar-border: #3A4A44;
  --sidebar-ring: #6FA89B;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-terracotta: var(--terracotta);
  --color-terracotta-foreground: var(--terracotta-foreground);
  --color-private: var(--private);
  --color-private-foreground: var(--private-foreground);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --font-sans: var(--font-sans);
  --font-serif: var(--font-serif);
  --font-mono: var(--font-mono);

  --radius-sm: calc(var(--radius) - 4px);   /* 12 */
  --radius-md: calc(var(--radius) - 4px);   /* 12 */
  --radius-lg: var(--radius);               /* 16 */
  --radius-xl: calc(var(--radius) + 4px);   /* 20 */
  --radius-2xl: calc(var(--radius) + 8px);  /* 24 浮层专用 */
}

@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, .font-serif {
    font-family: var(--font-serif);
  }
}

<body class="min-h-screen bg-background font-sans antialiased">
  <!--
    我的展览 · 桌面端
    - 桌面策展人 shell：sticky 左侧栏 240px（mine 高亮）+ 顶栏 + main
    - 展示已保存的展览快照（FMM.load().museum.savedImage），无则空状态
  -->
  <div class="mx-auto flex w-full max-w-[1440px] min-h-screen bg-background">
    <!-- 左侧栏：curatorSidebar 规范，mine 高亮（activeItemClasses: text-primary bg-secondary font-medium） -->
    <aside class="sticky top-0 hidden h-screen w-60 shrink-0 flex-col border-r border-border bg-sidebar md:flex">
      <div class="flex items-center gap-2 px-6 py-5">
        <span class="h-2.5 w-2.5 rounded-full bg-primary"></span>
        <span class="font-serif text-lg text-foreground">家·记忆博物馆</span>
      </div>
      <nav class="flex flex-1 flex-col gap-1 px-3">
        <a data-nav-item data-nav-key="home" data-dom-id="fmm-nav-home" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-sidebar-foreground/70 hover:bg-sidebar-accent/60 hover:text-sidebar-foreground"><i data-lucide="home" class="h-[18px] w-[18px]"></i>首页</a>
        <a data-nav-item data-nav-key="create" data-dom-id="fmm-nav-create" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-sidebar-foreground/70 hover:bg-sidebar-accent/60 hover:text-sidebar-foreground"><i data-lucide="plus" class="h-[18px] w-[18px]"></i>创建</a>
        <a data-nav-item data-nav-key="gallery" data-dom-id="fmm-nav-gallery" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-sidebar-foreground/70 hover:bg-sidebar-accent/60 hover:text-sidebar-foreground"><i data-lucide="layout-grid" class="h-[18px] w-[18px]"></i>展馆</a>
        <a data-nav-item data-nav-key="visit" data-dom-id="fmm-nav-visit" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-sidebar-foreground/70 hover:bg-sidebar-accent/60 hover:text-sidebar-foreground"><i data-lucide="eye" class="h-[18px] w-[18px]"></i>参观</a>
        <a data-nav-item data-nav-key="mine" data-dom-id="fmm-nav-mine" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-primary bg-secondary font-medium"><i data-lucide="user" class="h-[18px] w-[18px]"></i>我的</a>
      </nav>
    </aside>

    <!-- 右侧：顶栏 + 内容区 -->
    <div class="flex min-h-screen flex-1 flex-col">
      <!-- 顶栏：curatorTopbar 规范 -->
      <header class="sticky top-0 z-30 flex items-center justify-between border-b border-border bg-card/80 px-8 py-3 backdrop-blur">
        <div class="text-sm text-muted-foreground">策展工作台 · 我的展览</div>
        <div class="flex items-center gap-4">
        </div>
      </header>

      <!-- 内容区 main slot -->
      <main id="fmm-page-content" class="flex-1 bg-background p-8">
        <h1 class="font-serif text-[28px] leading-tight text-foreground mb-6">我的展览</h1>
        <div id="saved-image-container" class="max-w-2xl mx-auto">
          <!-- 快照或空状态由脚本注入 -->
        </div>
      </main>
    </div>
  </div>

  <script>if(window.lucide){lucide.createIcons();}</script>
  <script src="../assets/fmm-app.js"></script>

  <script>
  /* fmm-interaction · 我的展览快照展示 */
  (function(){
    function ready(fn){ if(document.readyState!=='loading'){fn();}else{document.addEventListener('DOMContentLoaded',fn);} }
    ready(function(){
      var FMM = window.FMM;
      var d = FMM ? FMM.load() : {};
      var container = document.getElementById('saved-image-container');
      var savedImage = d.museum && d.museum.savedImage;

      if (savedImage) {
        container.innerHTML =
          '<div class="rounded-lg overflow-hidden shadow-lg border border-border bg-card p-4">' +
            '<img src="' + savedImage + '" alt="展览快照" class="w-full rounded-md" />' +
          '</div>' +
          '<div class="mt-6 flex justify-center gap-3">' +
            '<a href="' + savedImage + '" download="family-memory-museum.png" class="inline-flex items-center gap-2 rounded-lg bg-primary px-6 py-3 text-[15px] font-medium text-primary-foreground hover:bg-primary/90">' +
              '<i data-lucide="download" class="h-4 w-4"></i>下载到本地' +
            '</a>' +
            '<a href="page-visit-end-desktop.html" class="inline-flex items-center gap-2 rounded-lg border border-border bg-card px-6 py-3 text-[15px] font-medium text-foreground hover:bg-muted">' +
              '<i data-lucide="rotate-ccw" class="h-4 w-4"></i>返回展览' +
            '</a>' +
          '</div>';
      } else {
        container.innerHTML =
          '<div class="text-center py-16">' +
            '<i data-lucide="image-off" class="h-12 w-12 mx-auto text-muted-foreground mb-4"></i>' +
            '<p class="text-[16px] text-foreground mb-2">您还没有保存的展览快照</p>' +
            '<p class="text-[14px] text-muted-foreground">完成参观后点击「保存为图片」即可在此查看</p>' +
            '<a href="page-visit-end-desktop.html" class="inline-flex items-center gap-2 rounded-lg bg-primary px-6 py-3 text-[15px] font-medium text-primary-foreground hover:bg-primary/90 mt-6">' +
              '<i data-lucide="arrow-right" class="h-4 w-4"></i>前往参观' +
            '</a>' +
          '</div>';
      }

      /* 侧栏导航跳转 */
      var navJumps = {
        'fmm-nav-home': 'page-welcome-setup-desktop.html',
        'fmm-nav-gallery': 'page-exhibition-editor-desktop.html',
        'fmm-nav-create': 'page-archive-card-desktop.html',
        'fmm-nav-visit': 'page-visit-exhibit-desktop.html',
        'fmm-nav-mine': 'page-mine-desktop.html'
      };
      Object.keys(navJumps).forEach(function(domId){
        document.querySelectorAll('[data-dom-id="'+domId+'"]').forEach(function(el){
          el.addEventListener('click', function(e){ e.preventDefault(); location.href = navJumps[domId]; });
        });
      });
      if(window.lucide){ lucide.createIcons(); }
    });
  })();
  </script>
