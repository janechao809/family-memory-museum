<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⑦观众便签与结束页</title>
    <style id="theme-vars">
@import "tailwindcss";

@custom-variant dark (&:is(.dark *));

:root {
  /* —— 语义表面 —— */
  --background: #F7F2E9;          /* bg.canvas 暖白纸 */
  --foreground: #243A36;          /* text.primary */
  --card: #FFFDF8;                /* bg.surface */
  --card-foreground: #243A36;
  --popover: #FFFDF8;
  --popover-foreground: #243A36;

  /* —— 品牌 / 主操作 —— */
  --primary: #315B50;             /* brand.forest 主按钮/链接 */
  --primary-foreground: #FFFDF8;
  --secondary: #DDE8E2;           /* accent.mist 选中态 */
  --secondary-foreground: #243A36;
  --accent: #D8A84D;              /* accent.mustard 编号/路径节点 */
  --accent-foreground: #243A36;
  --muted: #EFE7D8;
  --muted-foreground: #63736D;    /* text.secondary */

  /* —— 描边 / 输入 / 聚焦 —— */
  --border: #E7DDD0;              /* border.soft */
  --input: #E7DDD0;
  --ring: #315B50;

  /* —— 自定义品牌色（多色相，用户文档显式指定） —— */
  --terracotta: #B86A4A;          /* brand.terracotta 录音/强调 */
  --terracotta-foreground: #FFFDF8;
  --private: #5D6F8B;             /* status.private 私密标记 */
  --private-foreground: #FFFDF8;

  /* —— 图表（低饱和档案感） —— */
  --chart-1: #315B50;
  --chart-2: #B86A4A;
  --chart-3: #D8A84D;
  --chart-4: #5D6F8B;
  --chart-5: #63736D;

  /* —— 侧栏 —— */
  --sidebar: #FFFDF8;
  --sidebar-foreground: #243A36;
  --sidebar-primary: #315B50;
  --sidebar-primary-foreground: #FFFDF8;
  --sidebar-accent: #DDE8E2;
  --sidebar-accent-foreground: #243A36;
  --sidebar-border: #E7DDD0;
  --sidebar-ring: #315B50;

  /* —— 圆角 —— */
  --radius: 16px;
  /* 品牌前缀语义别名（fill-html-head.mjs semantic mapping） */
  --fmm-radius-sm: 12px;
  --fmm-radius-md: 12px;
  --fmm-radius-lg: 16px;
  --fmm-radius-xl: 20px;
  --fmm-radius-2xl: 24px;

  /* —— 字体族 —— */
  --font-serif: "Noto Serif SC", "Songti SC", serif;
  --font-sans: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* —— 语义别名（semantic-token-fallback） —— */
  --semantic-bg-canvas: var(--background);
  --semantic-bg-surface: var(--card);
  --semantic-bg-muted: var(--muted);
  --semantic-text-primary: var(--foreground);
  --semantic-text-secondary: var(--muted-foreground);
  --semantic-text-on-primary: var(--primary-foreground);
  --semantic-brand-forest: var(--primary);
  --semantic-brand-terracotta: var(--terracotta);
  --semantic-accent-mustard: var(--accent);
  --semantic-accent-mist: var(--secondary);
  --semantic-border-soft: var(--border);
  --semantic-status-private: var(--private);
  --semantic-ring: var(--ring);
}

.dark {
  --background: #1E2B27;
  --foreground: #F2EBDC;
  --card: #26332F;
  --card-foreground: #F2EBDC;
  --popover: #26332F;
  --popover-foreground: #F2EBDC;
  --primary: #6FA89B;
  --primary-foreground: #1E2B27;
  --secondary: #3A4A44;
  --secondary-foreground: #F2EBDC;
  --accent: #E0BC6A;
  --accent-foreground: #1E2B27;
  --muted: #313F3A;
  --muted-foreground: #9CA8A2;
  --border: #3A4A44;
  --input: #3A4A44;
  --ring: #6FA89B;
  --terracotta: #D08A68;
  --terracotta-foreground: #1E2B27;
  --private: #8AA0BD;
  --private-foreground: #1E2B27;
  --chart-1: #6FA89B;
  --chart-2: #D08A68;
  --chart-3: #E0BC6A;
  --chart-4: #8AA0BD;
  --chart-5: #9CA8A2;
  --sidebar: #26332F;
  --sidebar-foreground: #F2EBDC;
  --sidebar-primary: #6FA89B;
  --sidebar-primary-foreground: #1E2B27;
  --sidebar-accent: #3A4A44;
  --sidebar-accent-foreground: #F2EBDC;
  --sidebar-border: #3A4A44;
  --sidebar-ring: #6FA89B;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-terracotta: var(--terracotta);
  --color-terracotta-foreground: var(--terracotta-foreground);
  --color-private: var(--private);
  --color-private-foreground: var(--private-foreground);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --font-sans: var(--font-sans);
  --font-serif: var(--font-serif);
  --font-mono: var(--font-mono);

  --radius-sm: calc(var(--radius) - 4px);   /* 12 */
  --radius-md: calc(var(--radius) - 4px);   /* 12 */
  --radius-lg: var(--radius);               /* 16 */
  --radius-xl: calc(var(--radius) + 4px);   /* 20 */
  --radius-2xl: calc(var(--radius) + 8px);  /* 24 浮层专用 */
}

@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, .font-serif {
    font-family: var(--font-serif);
  }
}

<body class="min-h-screen bg-background font-sans antialiased">
  <!--
    ⑦受邀参观·结束页 · 桌面端（document-scroll）
    - 观众桌面 shell：极简顶栏（visitorTopbar 规范）+ main，无左侧栏（沿用⑥）
    - 双列：左 sticky 结束提问+策展人反思 50% / 右滚动 便签输入+便签瀑布 50%，gap-8
  -->
  <div class="mx-auto w-full max-w-[1440px] min-h-screen bg-background">
    <!-- 极简顶栏：visitorTopbar 规范（左 terracotta 圆点 + 展览名宋体 / 右 进度 + 退出）—— 沿用⑥，保留不变 -->
    <header class="sticky top-0 z-30 flex items-center justify-between border-b border-border bg-card/80 px-6 py-3 backdrop-blur">
      <div class="flex items-center gap-3">
        <span class="h-2 w-2 rounded-full bg-terracotta"></span>
        <span class="font-serif text-base text-foreground">一件物品里的陪伴</span>
      </div>
      <div class="flex items-center gap-4 text-sm text-muted-foreground">
        <a data-dom-id="fmm-exit-visit" class="inline-flex items-center gap-1 hover:text-foreground">
          <i data-lucide="log-out" class="h-4 w-4"></i>退出
        </a>
      </div>
    </header>

    <!-- 内容区 main slot，无左侧栏 -->
    <main id="fmm-page-content" class="min-h-screen bg-background p-8">
      <!-- 双列：左 sticky 结束提问+策展人反思 50% / 右滚动 便签输入+便签瀑布 50% -->
      <div class="flex gap-8">

        <!-- 左列 50%：sticky 结束提问 + 策展人反思 -->
        <div class="w-1/2">
          <div class="sticky top-24 flex flex-col gap-5">

            <!-- 顶部小标 + 宋体大标题 -->
            <div>
              <div class="text-[12px] font-medium tracking-wide text-muted-foreground">展览到这里</div>
              <h1 class="mt-2 font-serif text-[32px] leading-tight text-foreground">这件物品为什么值得被留下？</h1>
            </div>

            <!-- 结束提问卡：mustard 细边 bg-card rounded-lg p-6 -->
            <div data-dom-id="fmm-final-answer" class="rounded-lg border border-accent/60 bg-card p-6">
              <div class="flex items-center gap-2">
                <i data-lucide="help-circle" class="h-4 w-4 text-accent"></i>
                <span class="text-[12px] font-medium tracking-wide text-muted-foreground">结束提问</span>
              </div>
              <p class="mt-3 font-serif text-[20px] leading-8 text-foreground">这件物品为什么值得被留下？</p>
              <div class="mt-4 border-l-2 border-accent/50 pl-4">
                <p class="font-serif text-[16px] leading-7 text-primary">"因为它不是一件东西，是一段还在继续的时间。"</p>
                <div class="mt-2 text-[12px] text-muted-foreground">—— 一位参观者的回答</div>
              </div>
            </div>

            <!-- 策展人反思卡：bg-card border rounded-lg p-5 -->
            <div class="rounded-lg border border-border bg-card p-5">
              <div class="flex items-center gap-2">
                <i data-lucide="compass" class="h-4 w-4 text-muted-foreground"></i>
                <span class="text-[12px] font-medium tracking-wide text-muted-foreground">策展人反思</span>
              </div>
              <p class="mt-3 font-serif text-[17px] leading-7 text-foreground">我的策展让观众看见了什么？又遗漏了什么？</p>
              <textarea data-dom-id="fmm-curator-reflect-input" rows="4" placeholder="在这里写下你的反思……" class="mt-4 w-full resize-none rounded-lg border border-border bg-background px-3 py-2.5 text-[14px] leading-6 text-foreground placeholder:text-muted-foreground/70 focus:border-primary focus:outline-none"></textarea>
              <div class="mt-2 flex justify-end">
                <button type="button" data-dom-id="fmm-curator-reflect-save" class="inline-flex items-center gap-2 rounded-lg bg-primary px-4 py-2 text-[13px] font-medium text-primary-foreground transition hover:bg-primary/90 active:opacity-90">
                  <i data-lucide="save" class="h-4 w-4"></i>保存
                </button>
              </div>
            </div>

          </div>
        </div>

        <!-- 右列 50%：滚动 便签输入 + 便签瀑布 -->
        <div class="flex w-1/2 flex-col gap-5">

          <!-- 便签输入卡：bg-card border rounded-lg p-5 -->
          <div data-dom-id="fmm-note-input" class="rounded-lg border border-border bg-card p-5">
            <div class="flex items-center gap-2">
              <i data-lucide="sticky-note" class="h-4 w-4 text-muted-foreground"></i>
              <span class="text-[12px] font-medium tracking-wide text-muted-foreground">留下一张便签</span>
            </div>
            <div class="mt-4 flex flex-col gap-3">
              <div>
                <label class="text-[13px] text-muted-foreground">我看见了___</label>
                <textarea rows="2" placeholder="一只缺了口的杯子，和三十年没换的人" class="mt-1.5 w-full resize-none rounded-lg border border-border bg-background px-3 py-2.5 text-[14px] leading-6 text-foreground placeholder:text-muted-foreground/70 focus:border-primary focus:outline-none"></textarea>
              </div>
              <div>
                <label class="text-[13px] text-muted-foreground">我想知道___</label>
                <textarea rows="2" placeholder="外婆现在还用它喝水吗？" class="mt-1.5 w-full resize-none rounded-lg border border-border bg-background px-3 py-2.5 text-[14px] leading-6 text-foreground placeholder:text-muted-foreground/70 focus:border-primary focus:outline-none"></textarea>
              </div>
            </div>
            <div class="mt-4 flex justify-end">
              <button type="button" data-dom-id="fmm-note-submit" class="inline-flex items-center gap-2 rounded-lg bg-primary px-5 py-2.5 text-[14px] font-medium text-primary-foreground transition hover:bg-primary/90 active:opacity-90">
                <i data-lucide="plus" class="h-4 w-4"></i>
                贴上便签
              </button>
            </div>
          </div>

          <!-- 已留便签瀑布：mist/secondary 色便签感，圆角，错落（columns 两列 masonry） -->
          <div>
            <div class="flex items-center gap-2 px-1">
              <i data-lucide="messages-square" class="h-4 w-4 text-muted-foreground"></i>
              <span class="text-[12px] font-medium tracking-wide text-muted-foreground">已留下的便签</span>
            </div>
            <div data-dom-id="fmm-notes-list" class="mt-3 gap-4 [column-count:2]">
              <!-- 初始为空；用户提交便签后动态插入 -->
            </div>
          </div>

        </div>

      </div>

      <!-- 展品快照：5 件展品缩略图横排（桌面端 grid-cols-5） -->
      <section class="mt-8">
        <div class="flex items-center gap-2 px-1">
          <i data-lucide="images" class="h-4 w-4 text-muted-foreground"></i>
          <span class="text-[12px] font-medium tracking-wide text-muted-foreground">展品快照</span>
        </div>
        <div data-dom-id="fmm-exhibit-snapshots" class="mt-3 grid grid-cols-5 gap-4"></div>
      </section>

      <!-- 底部完成参观：bg-primary 主按钮 + 保存为图片 -->
      <div class="mt-10 flex flex-col items-center gap-3 border-t border-border pt-8">
        <p class="font-serif text-[16px] text-foreground">谢谢你走完这次展览。</p>
        <div class="flex items-center gap-3">
          <button type="button" data-dom-id="fmm-finish-visit" class="inline-flex items-center gap-2 rounded-lg bg-primary px-7 py-3 text-[15px] font-medium text-primary-foreground transition hover:bg-primary/90 active:opacity-90">
            完成参观
            <i data-lucide="check" class="h-4 w-4"></i>
          </button>
          <button type="button" data-dom-id="fmm-save-image" class="inline-flex items-center gap-2 rounded-lg border border-border bg-card px-6 py-3 text-[15px] font-medium text-foreground transition hover:bg-muted active:opacity-90">
            <i data-lucide="download" class="h-4 w-4"></i>
            保存为图片
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>if(window.lucide){lucide.createIcons();}</script>
  <script src="../assets/fmm-app.js?v=2"></script>
  <script>
  (function(){
    function ready(fn){
      if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', fn); }
      else { fn(); }
    }
    ready(function(){
      var FMM = window.FMM;
      var labels = ['我看见了','我想知道'];

      /* 初始状态：清除默认示例便签，使"已留下的便签"区域为空（仅本会话首次进入） */
      var NOTES_INIT_KEY = 'fmm_visit_end_notes_init';
      if (FMM && !sessionStorage.getItem(NOTES_INIT_KEY)) {
        var dInit = FMM.load();
        dInit.notes = [];
        FMM.save(dInit);
        sessionStorage.setItem(NOTES_INIT_KEY, '1');
      }

      /* 已留便签列表：加载时从 FMM.load().notes 动态渲染 */
      var notesContainer = document.querySelector('[data-dom-id="fmm-notes-list"]');
      function renderNote(note){
        var art = document.createElement('article');
        art.className = 'mb-4 break-inside-avoid rounded-lg border border-border bg-secondary/60 p-4';
        art.style.transform = 'rotate(' + (Math.random()*1.6-0.8).toFixed(2) + 'deg)';
        var lbl = document.createElement('p');
        lbl.className = 'text-[11px] font-medium uppercase tracking-wide text-muted-foreground';
        lbl.textContent = (note && note.type) ? note.type : '便签';
        var txt = document.createElement('p');
        txt.className = 'mt-1 font-serif text-[15px] leading-relaxed text-foreground';
        txt.textContent = (note && note.text) ? note.text : '';
        art.appendChild(lbl); art.appendChild(txt);
        return art;
      }
      function renderAllNotes(){
        if(!notesContainer) return;
        notesContainer.innerHTML = '';
        var data = FMM ? FMM.load() : null;
        var notes = (data && data.notes) ? data.notes : [];
        notes.forEach(function(note){ notesContainer.appendChild(renderNote(note)); });
      }
      renderAllNotes();

      /* 便签提交：两个 textarea 非空 → FMM.addNote + 动态插入便签 */
      var submitBtn = document.querySelector('[data-dom-id="fmm-note-submit"]');
      var inputCard = document.querySelector('[data-dom-id="fmm-note-input"]');
      if(submitBtn && inputCard){
        var textareas = inputCard.querySelectorAll('textarea');
        submitBtn.addEventListener('click', function(){
          var added = false;
          for(var i=0;i<textareas.length;i++){
            var ta = textareas[i];
            var val = (ta.value || '').trim();
            if(val){
              FMM.addNote(labels[i] || '便签', val);
              if(notesContainer){
                var data = FMM.load();
                var notes = (data && data.notes) ? data.notes : [];
                var last = notes[notes.length-1];
                if(last){ notesContainer.appendChild(renderNote(last)); }
              }
              ta.value = '';
              added = true;
            }
          }
          if(added && window.lucide){ lucide.createIcons(); }
        });
      }

      /* 策展人反思：textarea 直接输入 + 保存到 FMM（museum.curatorReflection） */
      var reflectInput = document.querySelector('[data-dom-id="fmm-curator-reflect-input"]');
      var reflectSaveBtn = document.querySelector('[data-dom-id="fmm-curator-reflect-save"]');
      if (reflectInput && FMM) {
        var dRefl = FMM.load();
        var savedRefl = dRefl.museum && dRefl.museum.curatorReflection;
        if (savedRefl) { reflectInput.value = savedRefl; }
      }
      if (reflectSaveBtn && reflectInput) {
        reflectSaveBtn.addEventListener('click', function(){
          if (!FMM) { alert('数据未就绪，请稍后再试'); return; }
          var d = FMM.load();
          if (!d.museum) d.museum = {};
          d.museum.curatorReflection = reflectInput.value || '';
          FMM.save(d);
          var orig = reflectSaveBtn.innerHTML;
          reflectSaveBtn.innerHTML = '<i data-lucide="check" class="h-4 w-4"></i>已保存';
          if (window.lucide) lucide.createIcons();
          setTimeout(function(){
            reflectSaveBtn.innerHTML = orig;
            if (window.lucide) lucide.createIcons();
          }, 1600);
        });
      }

      /* 展品快照：5 件展品缩略图（ex.photo 优先，否则回退 PHOTO_MAP） */
      var PHOTO_MAP = ['exhibit-enamel-mug.jpg','exhibit-photo-album.jpg','exhibit-fountain-pen.jpg','exhibit-mechanical-watch.jpg','exhibit-textbook.jpg'];
      var snapContainer = document.querySelector('[data-dom-id="fmm-exhibit-snapshots"]');
      if (snapContainer) {
        var exData = FMM ? FMM.load() : null;
        var exhibits = (exData && exData.exhibits) ? exData.exhibits : [];
        PHOTO_MAP.forEach(function(fallback, idx){
          var ex = exhibits[idx] || {};
          var src = ex.photo ? ex.photo : ('../assets/' + fallback);
          var name = ex.name || ('展品 ' + (idx + 1));
          var number = ex.number || String(idx + 1).padStart(2, '0');
          var card = document.createElement('div');
          card.className = 'flex flex-col gap-2';
          var imgWrap = document.createElement('div');
          imgWrap.className = 'aspect-square overflow-hidden rounded-lg border border-border bg-muted';
          var img = document.createElement('img');
          img.src = src;
          img.alt = name;
          img.loading = 'lazy';
          img.className = 'h-full w-full object-cover';
          imgWrap.appendChild(img);
          var meta = document.createElement('div');
          meta.className = 'text-center';
          var numEl = document.createElement('div');
          numEl.className = 'text-[11px] text-muted-foreground';
          numEl.textContent = number;
          var nameEl = document.createElement('div');
          nameEl.className = 'font-serif text-[14px] text-foreground';
          nameEl.textContent = name;
          meta.appendChild(numEl);
          meta.appendChild(nameEl);
          card.appendChild(imgWrap);
          card.appendChild(meta);
          snapContainer.appendChild(card);
        });
      }

      /* 将容器内的跨域图片转为 data URL，避免 html2canvas 出现 tainted canvas / CORS 失败 */
      function convertImagesToDataURL(container) {
        var imgs = container.querySelectorAll('img');
        var promises = [];
        imgs.forEach(function(img) {
          if (img.src.indexOf('data:') === 0) return; // already data URL
          promises.push(new Promise(function(resolve) {
            try {
              var canvas = document.createElement('canvas');
              var tempImg = new Image();
              tempImg.crossOrigin = 'anonymous';
              tempImg.onload = function() {
                canvas.width = tempImg.naturalWidth;
                canvas.height = tempImg.naturalHeight;
                canvas.getContext('2d').drawImage(tempImg, 0, 0);
                try {
                  img.src = canvas.toDataURL('image/jpeg', 0.8);
                } catch(e) {
                  // If CORS fails, keep original src
                }
                resolve();
              };
              tempImg.onerror = function() { resolve(); };
              tempImg.src = img.src;
            } catch(e) { resolve(); }
          }));
        });
        return Promise.all(promises);
      }

      /* 保存为图片：截取 main 内容并下载 PNG（html2canvas-pro 支持 oklab/oklch 颜色） */
      var saveImgBtn = document.querySelector('[data-dom-id="fmm-save-image"]');
      if (saveImgBtn) {
        saveImgBtn.addEventListener('click', function(){
          var target = document.querySelector('main') || document.body;
          var captureFn = window.html2canvasPro || window.html2canvas;
          if (typeof captureFn === 'undefined') {
            alert('图片库加载中，请稍后再试');
            return;
          }
          saveImgBtn.setAttribute('disabled', 'disabled');
          saveImgBtn.style.opacity = '0.7';
          saveImgBtn.textContent = '正在生成...';

          /* 先将跨域图片转为 data URL，避免 tainted canvas */
          convertImagesToDataURL(target).then(function() {
            return captureFn(target, {
              scale: 2,
              backgroundColor: '#F5F3EE',
              useCORS: true,
              allowTaint: true,
              logging: false
            });
          }).then(function(canvas) {
            /* 下载高清 PNG 到本地 */
            var pngUrl = canvas.toDataURL('image/png');
            var link = document.createElement('a');
            link.download = 'family-memory-museum.png';
            link.href = pngUrl;
            link.click();
            /* 压缩为 JPEG 保存到 localStorage（同步，避免回调丢失） */
            var maxW = 800;
            var scale = Math.min(1, maxW / canvas.width);
            var cw = Math.round(canvas.width * scale);
            var ch = Math.round(canvas.height * scale);
            var c2 = document.createElement('canvas');
            c2.width = cw; c2.height = ch;
            var ctx2 = c2.getContext('2d');
            ctx2.fillStyle = '#ffffff';
            ctx2.fillRect(0, 0, cw, ch);
            ctx2.drawImage(canvas, 0, 0, cw, ch);
            var jpegUrl = c2.toDataURL('image/jpeg', 0.72);
            try {
              var d = FMM.load();
              d.museum = d.museum || {};
              d.museum.savedImage = jpegUrl;
              var ok = FMM.save(d);
              console.log('[FMM] savedImage saved:', ok, 'jpegSize:', jpegUrl.length);
            } catch(e) { console.warn('[FMM] save image to storage failed:', e); }
            saveImgBtn.textContent = '已保存';
            setTimeout(function(){ saveImgBtn.textContent = '保存为图片'; }, 2000);
          }).catch(function(err){
            console.warn('[FMM] capture error:', err);
            alert('图片生成失败，请使用浏览器截图功能保存');
          }).then(function(){
            saveImgBtn.removeAttribute('disabled');
            saveImgBtn.style.opacity = '';
          });
        });
      }

      /* 跳转兜底 */
      var jumps = {
        'fmm-finish-visit': 'page-welcome-setup-desktop.html',
        'fmm-exit-visit': 'page-welcome-setup-desktop.html'
      };
      Object.keys(jumps).forEach(function(domId){
        var el = document.querySelector('[data-dom-id="'+domId+'"]');
        if(el){ el.addEventListener('click', function(){ location.href = jumps[domId]; }); }
      });
    });
  })();
  </script>
</body>
</html>
