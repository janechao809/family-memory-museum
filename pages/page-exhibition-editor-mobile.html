<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>④展览编辑器</title>
    <style id="theme-vars">
@import "tailwindcss";

@custom-variant dark (&:is(.dark *));

:root {
  /* —— 语义表面 —— */
  --background: #F7F2E9;          /* bg.canvas 暖白纸 */
  --foreground: #243A36;          /* text.primary */
  --card: #FFFDF8;                /* bg.surface */
  --card-foreground: #243A36;
  --popover: #FFFDF8;
  --popover-foreground: #243A36;

  /* —— 品牌 / 主操作 —— */
  --primary: #315B50;             /* brand.forest 主按钮/链接 */
  --primary-foreground: #FFFDF8;
  --secondary: #DDE8E2;           /* accent.mist 选中态 */
  --secondary-foreground: #243A36;
  --accent: #D8A84D;              /* accent.mustard 编号/路径节点 */
  --accent-foreground: #243A36;
  --muted: #EFE7D8;
  --muted-foreground: #63736D;    /* text.secondary */

  /* —— 描边 / 输入 / 聚焦 —— */
  --border: #E7DDD0;              /* border.soft */
  --input: #E7DDD0;
  --ring: #315B50;

  /* —— 自定义品牌色（多色相，用户文档显式指定） —— */
  --terracotta: #B86A4A;          /* brand.terracotta 录音/强调 */
  --terracotta-foreground: #FFFDF8;
  --private: #5D6F8B;             /* status.private 私密标记 */
  --private-foreground: #FFFDF8;

  /* —— 图表（低饱和档案感） —— */
  --chart-1: #315B50;
  --chart-2: #B86A4A;
  --chart-3: #D8A84D;
  --chart-4: #5D6F8B;
  --chart-5: #63736D;

  /* —— 侧栏 —— */
  --sidebar: #FFFDF8;
  --sidebar-foreground: #243A36;
  --sidebar-primary: #315B50;
  --sidebar-primary-foreground: #FFFDF8;
  --sidebar-accent: #DDE8E2;
  --sidebar-accent-foreground: #243A36;
  --sidebar-border: #E7DDD0;
  --sidebar-ring: #315B50;

  /* —— 圆角 —— */
  --radius: 16px;
  /* 品牌前缀语义别名（fill-html-head.mjs semantic mapping） */
  --fmm-radius-sm: 12px;
  --fmm-radius-md: 12px;
  --fmm-radius-lg: 16px;
  --fmm-radius-xl: 20px;
  --fmm-radius-2xl: 24px;

  /* —— 字体族 —— */
  --font-serif: "Noto Serif SC", "Songti SC", serif;
  --font-sans: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* —— 语义别名（semantic-token-fallback） —— */
  --semantic-bg-canvas: var(--background);
  --semantic-bg-surface: var(--card);
  --semantic-bg-muted: var(--muted);
  --semantic-text-primary: var(--foreground);
  --semantic-text-secondary: var(--muted-foreground);
  --semantic-text-on-primary: var(--primary-foreground);
  --semantic-brand-forest: var(--primary);
  --semantic-brand-terracotta: var(--terracotta);
  --semantic-accent-mustard: var(--accent);
  --semantic-accent-mist: var(--secondary);
  --semantic-border-soft: var(--border);
  --semantic-status-private: var(--private);
  --semantic-ring: var(--ring);
}

.dark {
  --background: #1E2B27;
  --foreground: #F2EBDC;
  --card: #26332F;
  --card-foreground: #F2EBDC;
  --popover: #26332F;
  --popover-foreground: #F2EBDC;
  --primary: #6FA89B;
  --primary-foreground: #1E2B27;
  --secondary: #3A4A44;
  --secondary-foreground: #F2EBDC;
  --accent: #E0BC6A;
  --accent-foreground: #1E2B27;
  --muted: #313F3A;
  --muted-foreground: #9CA8A2;
  --border: #3A4A44;
  --input: #3A4A44;
  --ring: #6FA89B;
  --terracotta: #D08A68;
  --terracotta-foreground: #1E2B27;
  --private: #8AA0BD;
  --private-foreground: #1E2B27;
  --chart-1: #6FA89B;
  --chart-2: #D08A68;
  --chart-3: #E0BC6A;
  --chart-4: #8AA0BD;
  --chart-5: #9CA8A2;
  --sidebar: #26332F;
  --sidebar-foreground: #F2EBDC;
  --sidebar-primary: #6FA89B;
  --sidebar-primary-foreground: #1E2B27;
  --sidebar-accent: #3A4A44;
  --sidebar-accent-foreground: #F2EBDC;
  --sidebar-border: #3A4A44;
  --sidebar-ring: #6FA89B;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-terracotta: var(--terracotta);
  --color-terracotta-foreground: var(--terracotta-foreground);
  --color-private: var(--private);
  --color-private-foreground: var(--private-foreground);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --font-sans: var(--font-sans);
  --font-serif: var(--font-serif);
  --font-mono: var(--font-mono);

  --radius-sm: calc(var(--radius) - 4px);   /* 12 */
  --radius-md: calc(var(--radius) - 4px);   /* 12 */
  --radius-lg: var(--radius);               /* 16 */
  --radius-xl: calc(var(--radius) + 4px);   /* 20 */
  --radius-2xl: calc(var(--radius) + 8px);  /* 24 浮层专用 */
}

@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, .font-serif {
    font-family: var(--font-serif);
  }
}

<body class="min-h-screen bg-background font-sans antialiased">
  <div class="mx-auto w-full max-w-[420px] min-h-screen bg-background">
    <!-- 极简顶栏 -->
    <header class="sticky top-0 z-30 border-b border-border bg-card/80 backdrop-blur" style="padding-top:env(safe-area-inset-top)">
      <div class="flex items-center justify-between px-5 py-3">
        <span class="font-serif text-base text-foreground">家庭记忆博物馆</span>
        <a href="#" data-dom-id="fmm-nav-mine" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-muted-foreground hover:bg-muted hover:text-foreground">
          <i data-lucide="user" class="h-[18px] w-[18px]"></i>
        </a>
      </div>
    </header>

    <!-- 内容区 main slot：底部留出底抽屉 + nav 高度 -->
    <main id="fmm-page-content" class="min-h-screen bg-background px-5 pb-[calc(320px+env(safe-area-inset-bottom))]">
      <!-- 展览名 + 动线结构切换 -->
      <section class="pt-5">
        <div class="flex items-center gap-1.5">
          <i data-lucide="book-open" class="h-3.5 w-3.5 text-muted-foreground"></i>
          <span class="text-xs text-muted-foreground">展览编辑器 · 第 4 步</span>
        </div>
        <h1 class="font-serif text-xl text-foreground mt-1.5">一件物品里的陪伴</h1>

        <!-- 动线结构切换 tab -->
        <div data-dom-id="fmm-structure-switch" class="mt-3 flex gap-2 overflow-x-auto no-scrollbar">
          <button class="rounded-lg bg-secondary px-3 py-1.5 text-xs font-medium text-primary whitespace-nowrap">时间线</button>
          <button class="rounded-lg border border-border px-3 py-1.5 text-xs font-medium text-muted-foreground whitespace-nowrap">房间地图</button>
          <button class="rounded-lg border border-border px-3 py-1.5 text-xs font-medium text-muted-foreground whitespace-nowrap">提问线</button>
          <button class="rounded-lg border border-border px-3 py-1.5 text-xs font-medium text-muted-foreground whitespace-nowrap">对照线</button>
        </div>
      </section>

      <!-- 长按拖拽提示 -->
      <div class="mt-4 mb-3 flex items-center gap-1.5 text-xs text-muted-foreground">
        <i data-lucide="move" class="h-3.5 w-3.5"></i>
        <span>长按拖动调整参观顺序</span>
      </div>

      <!-- 纵向路线画布（时间线结构） -->
      <section>
        <!-- 入口节点 -->
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-accent">
            <i data-lucide="door-open" class="h-5 w-5 text-accent-foreground"></i>
          </div>
          <div>
            <div class="text-[10px] uppercase tracking-wide text-muted-foreground">入口</div>
            <div class="font-serif text-sm text-foreground">外婆的相册</div>
          </div>
        </div>

        <!-- 虚线连接 -->
        <div class="ml-5 h-6 border-l-2 border-dashed border-border"></div>

        <!-- 展品节点 1: 1978 搪瓷杯 (妈妈—01) -->
        <div class="rounded-lg border border-border bg-card p-3">
          <div class="flex items-start gap-3">
            <img src="../assets/exhibit-enamel-mug.jpg" alt="搪瓷杯" class="h-12 w-16 shrink-0 rounded-md object-cover">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="inline-flex items-center rounded-md bg-accent px-1.5 py-0.5 text-[10px] font-medium text-accent-foreground">妈妈—01</span>
                <span class="text-xs text-muted-foreground">1978</span>
              </div>
              <div class="font-serif text-sm text-foreground mt-1">搪瓷杯</div>
              <div class="text-xs text-muted-foreground mt-0.5 leading-snug">为什么放在这里：陪伴的起点</div>
            </div>
            <div class="flex flex-col items-center gap-2 shrink-0">
              <i data-lucide="grip-vertical" class="h-4 w-4 text-muted-foreground"></i>
              <i data-lucide="lock" class="h-4 w-4 text-private"></i>
            </div>
          </div>
        </div>

        <!-- 虚线连接 -->
        <div class="ml-5 h-6 border-l-2 border-dashed border-border"></div>

        <!-- 展品节点 2: 1980s 相册 (外婆—02) -->
        <div class="rounded-lg border border-border bg-card p-3">
          <div class="flex items-start gap-3">
            <img src="../assets/exhibit-photo-album.jpg" alt="相册" class="h-12 w-16 shrink-0 rounded-md object-cover">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="inline-flex items-center rounded-md bg-accent px-1.5 py-0.5 text-[10px] font-medium text-accent-foreground">外婆—02</span>
                <span class="text-xs text-muted-foreground">1980s</span>
              </div>
              <div class="font-serif text-sm text-foreground mt-1">相册</div>
              <div class="text-xs text-muted-foreground mt-0.5 leading-snug">为什么放在这里：一家人的脸慢慢多了</div>
            </div>
            <div class="flex flex-col items-center gap-2 shrink-0">
              <i data-lucide="grip-vertical" class="h-4 w-4 text-muted-foreground"></i>
              <i data-lucide="lock" class="h-4 w-4 text-private"></i>
            </div>
          </div>
        </div>

        <!-- 虚线连接 -->

  <script>
  (function(){
    function ready(fn){ if(document.readyState!=='loading'){fn();}else{document.addEventListener('DOMContentLoaded',fn);} }
    ready(function(){
      var FMM = window.FMM;
      var data = FMM ? FMM.load() : null;

      /* 展览标题同步当前主题（FMM.theme.selected） */
      if(data && data.theme && data.theme.selected){
        var themeH1 = document.querySelector('#fmm-page-content h1.font-serif');
        if(themeH1){ themeH1.textContent = data.theme.selected; }
      }

      function tabGroupEls(tabs, activeClasses, inactiveClasses){
        tabs = Array.prototype.slice.call(tabs);
        tabs.forEach(function(t){
          t.addEventListener('click', function(){
            tabs.forEach(function(o){
              activeClasses.split(' ').forEach(function(c){ if(c) o.classList.remove(c); });
              inactiveClasses.split(' ').forEach(function(c){ if(c) o.classList.add(c); });
            });
            activeClasses.split(' ').forEach(function(c){ if(c) t.classList.add(c); });
            inactiveClasses.split(' ').forEach(function(c){ if(c) t.classList.remove(c); });
          });
        });
      }

      /* 动线结构 tab 互斥（时间线/房间地图/提问线/对照线）+ FMM 持久化 */
      var structKeys = ['timeline','room','question','contrast'];
      var structBtns = Array.prototype.slice.call(document.querySelectorAll('[data-dom-id="fmm-structure-switch"] button'));
      var STRUCT_ACTIVE = ['bg-secondary','text-primary'];
      var STRUCT_INACTIVE = ['border','border-border','text-muted-foreground'];
      function selectStructure(key, persist){
        structBtns.forEach(function(b, i){
          var isActive = (structKeys[i] === key);
          STRUCT_ACTIVE.forEach(function(c){ b.classList.remove(c); });
          STRUCT_INACTIVE.forEach(function(c){ b.classList.remove(c); });
          if(isActive){ STRUCT_ACTIVE.forEach(function(c){ b.classList.add(c); }); }
          else { STRUCT_INACTIVE.forEach(function(c){ b.classList.add(c); }); }
        });
        if(persist){ var d = FMM.load(); d.structure = key; FMM.save(d); }
      }
      structBtns.forEach(function(b, i){
        b.addEventListener('click', function(){ selectStructure(structKeys[i], true); });
      });
      var savedStruct = (data && data.structure) ? data.structure : 'timeline';
      selectStructure(savedStruct, false);

      /* 底部抽屉工具 tab 互斥（编号/展签/语音/动线）—— 保留原有交互 */
      var toolTexts = ['编号','展签','语音','动线'];
      var toolTabs = Array.prototype.slice.call(document.querySelectorAll('button')).filter(function(b){
        return toolTexts.indexOf((b.textContent||'').trim()) !== -1;
      });
      tabGroupEls(toolTabs, 'bg-secondary text-primary', 'text-muted-foreground');

      /* 编号样式互斥单选（inline boxShadow 选中环）+ FMM 持久化 */
      var styleBtns = Array.prototype.slice.call(document.querySelectorAll('[data-style-opt]'));
      var RING_SEL = '0 0 0 2px var(--card), 0 0 0 4px var(--primary)';
      function selectStyle(key, persist){
        styleBtns.forEach(function(b){
          b.style.boxShadow = (b.getAttribute('data-style-opt') === key) ? RING_SEL : '';
        });
        if(persist){ var d = FMM.load(); d.labelStyle = key; FMM.save(d); }
      }
      styleBtns.forEach(function(b){
        var underline = b.querySelector('span.absolute');
        if(underline){ underline.style.display = 'none'; }
        b.addEventListener('click', function(){
          selectStyle(b.getAttribute('data-style-opt'), true);
        });
      });
      var savedStyle = (data && data.labelStyle) ? data.labelStyle : 'circle';
      selectStyle(savedStyle, false);

      /* 发布展览：直接跳转到 ⑤ 展签与语音 */
      var publishBtn2 = document.querySelector('[data-dom-id="fmm-publish"]');
      if(publishBtn2){
        publishBtn2.addEventListener('click', function(e){
          e.preventDefault();
          var d = FMM.load(); FMM.save(d);
          location.href = 'page-label-audio-mobile.html';
        });
      }

      /* 底部五栏 nav 跳转 */
      var navJumps = {
        'fmm-nav-home': 'page-welcome-setup-mobile.html',
        'fmm-nav-gallery': 'page-theme-cocuration-mobile.html',
        'fmm-nav-create': 'page-archive-card-mobile.html',
        'fmm-nav-visit': 'page-visit-exhibit-mobile.html'
      };
      Object.keys(navJumps).forEach(function(domId){
        document.querySelectorAll('[data-dom-id="'+domId+'"]').forEach(function(el){
          el.addEventListener('click', function(e){ e.preventDefault(); location.href = navJumps[domId]; });
        });
      });
      document.querySelectorAll('[data-dom-id="fmm-nav-mine"]').forEach(function(el){
        el.addEventListener('click', function(e){ e.preventDefault(); alert('个人中心 · 待开发'); });
      });
    });
  })();
  </script>
