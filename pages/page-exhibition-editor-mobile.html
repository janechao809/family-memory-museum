<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>④展览编辑器</title>
    <style id="theme-vars">
@import "tailwindcss";

@custom-variant dark (&:is(.dark *));

:root {
  /* —— 语义表面 —— */
  --background: #F7F2E9;          /* bg.canvas 暖白纸 */
  --foreground: #243A36;          /* text.primary */
  --card: #FFFDF8;                /* bg.surface */
  --card-foreground: #243A36;
  --popover: #FFFDF8;
  --popover-foreground: #243A36;

  /* —— 品牌 / 主操作 —— */
  --primary: #315B50;             /* brand.forest 主按钮/链接 */
  --primary-foreground: #FFFDF8;
  --secondary: #DDE8E2;           /* accent.mist 选中态 */
  --secondary-foreground: #243A36;
  --accent: #D8A84D;              /* accent.mustard 编号/路径节点 */
  --accent-foreground: #243A36;
  --muted: #EFE7D8;
  --muted-foreground: #63736D;    /* text.secondary */

  /* —— 描边 / 输入 / 聚焦 —— */
  --border: #E7DDD0;              /* border.soft */
  --input: #E7DDD0;
  --ring: #315B50;

  /* —— 自定义品牌色（多色相，用户文档显式指定） —— */
  --terracotta: #B86A4A;          /* brand.terracotta 录音/强调 */
  --terracotta-foreground: #FFFDF8;
  --private: #5D6F8B;             /* status.private 私密标记 */
  --private-foreground: #FFFDF8;

  /* —— 图表（低饱和档案感） —— */
  --chart-1: #315B50;
  --chart-2: #B86A4A;
  --chart-3: #D8A84D;
  --chart-4: #5D6F8B;
  --chart-5: #63736D;

  /* —— 侧栏 —— */
  --sidebar: #FFFDF8;
  --sidebar-foreground: #243A36;
  --sidebar-primary: #315B50;
  --sidebar-primary-foreground: #FFFDF8;
  --sidebar-accent: #DDE8E2;
  --sidebar-accent-foreground: #243A36;
  --sidebar-border: #E7DDD0;
  --sidebar-ring: #315B50;

  /* —— 圆角 —— */
  --radius: 16px;
  /* 品牌前缀语义别名（fill-html-head.mjs semantic mapping） */
  --fmm-radius-sm: 12px;
  --fmm-radius-md: 12px;
  --fmm-radius-lg: 16px;
  --fmm-radius-xl: 20px;
  --fmm-radius-2xl: 24px;

  /* —— 字体族 —— */
  --font-serif: "Noto Serif SC", "Songti SC", serif;
  --font-sans: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* —— 语义别名（semantic-token-fallback） —— */
  --semantic-bg-canvas: var(--background);
  --semantic-bg-surface: var(--card);
  --semantic-bg-muted: var(--muted);
  --semantic-text-primary: var(--foreground);
  --semantic-text-secondary: var(--muted-foreground);
  --semantic-text-on-primary: var(--primary-foreground);
  --semantic-brand-forest: var(--primary);
  --semantic-brand-terracotta: var(--terracotta);
  --semantic-accent-mustard: var(--accent);
  --semantic-accent-mist: var(--secondary);
  --semantic-border-soft: var(--border);
  --semantic-status-private: var(--private);
  --semantic-ring: var(--ring);
}

.dark {
  --background: #1E2B27;
  --foreground: #F2EBDC;
  --card: #26332F;
  --card-foreground: #F2EBDC;
  --popover: #26332F;
  --popover-foreground: #F2EBDC;
  --primary: #6FA89B;
  --primary-foreground: #1E2B27;
  --secondary: #3A4A44;
  --secondary-foreground: #F2EBDC;
  --accent: #E0BC6A;
  --accent-foreground: #1E2B27;
  --muted: #313F3A;
  --muted-foreground: #9CA8A2;
  --border: #3A4A44;
  --input: #3A4A44;
  --ring: #6FA89B;
  --terracotta: #D08A68;
  --terracotta-foreground: #1E2B27;
  --private: #8AA0BD;
  --private-foreground: #1E2B27;
  --chart-1: #6FA89B;
  --chart-2: #D08A68;
  --chart-3: #E0BC6A;
  --chart-4: #8AA0BD;
  --chart-5: #9CA8A2;
  --sidebar: #26332F;
  --sidebar-foreground: #F2EBDC;
  --sidebar-primary: #6FA89B;
  --sidebar-primary-foreground: #1E2B27;
  --sidebar-accent: #3A4A44;
  --sidebar-accent-foreground: #F2EBDC;
  --sidebar-border: #3A4A44;
  --sidebar-ring: #6FA89B;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-terracotta: var(--terracotta);
  --color-terracotta-foreground: var(--terracotta-foreground);
  --color-private: var(--private);
  --color-private-foreground: var(--private-foreground);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --font-sans: var(--font-sans);
  --font-serif: var(--font-serif);
  --font-mono: var(--font-mono);

  --radius-sm: calc(var(--radius) - 4px);   /* 12 */
  --radius-md: calc(var(--radius) - 4px);   /* 12 */
  --radius-lg: var(--radius);               /* 16 */
  --radius-xl: calc(var(--radius) + 4px);   /* 20 */
  --radius-2xl: calc(var(--radius) + 8px);  /* 24 浮层专用 */
}

@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, .font-serif {
    font-family: var(--font-serif);
  }
}

    </style>

<body class="min-h-screen bg-background font-sans antialiased">
  <div class="mx-auto w-full max-w-[420px] min-h-screen bg-background">
    <!-- 内容区 main slot：极简发布页 -->
    <main id="fmm-page-content" class="min-h-screen bg-background px-5 pb-[calc(72px+env(safe-area-inset-bottom))]">
      <section class="pt-8">
        <h1 class="font-serif text-xl text-foreground">发布展览</h1>
        <p class="mt-2 text-sm text-muted-foreground">确认展品信息后，发布你的家庭记忆展览</p>
      </section>

      <!-- 家庭成员确认 -->
      <section class="px-4 pb-4 mt-8">
        <div class="rounded-lg border border-border bg-card p-4">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="font-serif text-[16px] text-foreground">家庭成员确认</h2>
            <span data-fmm-role="confirm-count" class="shrink-0 rounded-full bg-secondary px-2.5 py-0.5 text-[11px] font-medium text-primary">0 / 5 已上传</span>
          </div>
          <p class="mb-3 text-[12px] leading-snug text-muted-foreground">每位家人上传展品照片后视为确认。全部确认后即可发布展览。</p>
          <div data-fmm-role="member-list" class="space-y-2">
            <!-- JS 动态填充 -->
          </div>
        </div>
      </section>

      <!-- 发布主按钮 -->
      <div class="mt-8 flex gap-3">
        <button data-dom-id="fmm-back-upload" class="flex-1 rounded-lg border border-border bg-card px-5 py-3 text-sm font-medium text-foreground active:opacity-90">
          返回上一页
        </button>
        <button data-dom-id="fmm-publish" class="flex flex-[1.4] items-center justify-center gap-2 rounded-lg bg-primary px-5 py-3 text-sm font-medium text-primary-foreground active:opacity-90">
          <i data-lucide="send" class="h-4 w-4"></i>
          发布展览
        </button>
      </div>
    </main>
  </div>

  <!-- 底部五栏 nav：canonicalHtmlByKey["create"]（create active） -->

  <script>

  <script>
  (function(){
    function ready(fn){ if(document.readyState!=='loading'){fn();}else{document.addEventListener('DOMContentLoaded',fn);} }
    ready(function(){
      var FMM = window.FMM;

      /* 家庭成员确认：直接从数据派生，确保顺序与内容始终一致 */
      var fmmData = FMM.load();
      var exhibits = fmmData.exhibits || [];
      var confirmedCount = 0;
      /* 系统范例图映射（按展品索引，与数据顺序严格一致） */
      var PHOTO_MAP = ['exhibit-enamel-mug.jpg','exhibit-photo-album.jpg','exhibit-fountain-pen.jpg','exhibit-mechanical-watch.jpg','exhibit-textbook.jpg'];
      var memberListEl = document.querySelector('[data-fmm-role="member-list"]');
      if(memberListEl){
        memberListEl.innerHTML = '';
        /* 直接从数据派生成员列表 */
        exhibits.forEach(function(ex, idx){
          var hasUpload = !!(ex && ex.photo && String(ex.photo).trim().length > 0);
          var isSaved = hasUpload; /* 只有真正上传了照片才算已确认 */
          if(isSaved) confirmedCount++;
          /* 照片：有上传用上传图，否则用系统范例图 */
          var photoSrc = hasUpload ? ex.photo : ('../assets/' + (PHOTO_MAP[idx] || 'exhibit-enamel-mug.jpg'));
          var photoAlt = (ex && ex.name) ? ex.name : (ex ? ex.owner : '');
          var ownerLabel = (ex && ex.owner) ? ex.owner : '';
          var nameLabel = (ex && ex.name) ? ' · ' + ex.name : '';
          var item = document.createElement('div');
          item.className = 'flex items-center gap-2.5 rounded-md border border-border bg-background px-3 py-2';
          item.innerHTML =
            '<img src="' + photoSrc + '" alt="' + photoAlt + '" class="h-10 w-10 shrink-0 rounded-md object-cover" />'
            + '<div class="flex-1 min-w-0"><p class="truncate text-[13px] ' + (isSaved ? 'text-foreground' : 'text-muted-foreground') + '">' + ownerLabel + nameLabel + '</p></div>'
            + '<span class="shrink-0 text-[12px] ' + (hasUpload ? 'text-primary' : 'text-muted-foreground') + '">' + (hasUpload ? '✓ 已上传' : '范例图') + '</span>';
          memberListEl.appendChild(item);
        });
      }
      var confirmCounter = document.querySelector('[data-fmm-role="confirm-count"]');
      if(confirmCounter){ confirmCounter.textContent = confirmedCount + ' / 5 已上传'; }

      /* 返回上一页按钮：回到档案卡继续为其他家人上传展品 */
      var backUploadBtn = document.querySelector('[data-dom-id="fmm-back-upload"]');
      if(backUploadBtn){
        backUploadBtn.addEventListener('click', function(){
          location.href = 'page-archive-card-mobile.html';
        });
      }

      /* 发布按钮：未全部确认时提示，并跳转 ⑤ 展签与语音 */
      var publishBtn = document.querySelector('[data-dom-id="fmm-publish"]');
      if(publishBtn){
        publishBtn.addEventListener('click', function(e){
          if(confirmedCount < 5){
            if(!confirm('还有 ' + (5 - confirmedCount) + ' 位家人未保存展品信息，确定要发布吗？')){
              e.preventDefault();
              return;
            }
          }
          location.href = 'page-label-audio-mobile.html';
        });
      }

      /* 底部五栏 nav 跳转 */
      var navJumps = {
        'fmm-nav-home': 'page-welcome-setup-mobile.html',
        'fmm-nav-gallery': 'page-exhibition-editor-mobile.html',
        'fmm-nav-create': 'page-archive-card-mobile.html',
        'fmm-nav-visit': 'page-visit-exhibit-mobile.html'
      };
      Object.keys(navJumps).forEach(function(domId){
        document.querySelectorAll('[data-dom-id="'+domId+'"]').forEach(function(el){
          el.addEventListener('click', function(e){ e.preventDefault(); location.href = navJumps[domId]; });
        });
      });
      document.querySelectorAll('[data-dom-id="fmm-nav-mine"]').forEach(function(el){
        el.addEventListener('click', function(e){ e.preventDefault(); location.href = 'page-mine-mobile.html'; });
      });
    });
  })();
  </script>
</body>
</html>
