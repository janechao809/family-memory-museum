<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>①欢迎与建馆</title>
    <style id="theme-vars">
@import "tailwindcss";

@custom-variant dark (&:is(.dark *));

:root {
  /* —— 语义表面 —— */
  --background: #F7F2E9;          /* bg.canvas 暖白纸 */
  --foreground: #243A36;          /* text.primary */
  --card: #FFFDF8;                /* bg.surface */
  --card-foreground: #243A36;
  --popover: #FFFDF8;
  --popover-foreground: #243A36;

  /* —— 品牌 / 主操作 —— */
  --primary: #315B50;             /* brand.forest 主按钮/链接 */
  --primary-foreground: #FFFDF8;
  --secondary: #DDE8E2;           /* accent.mist 选中态 */
  --secondary-foreground: #243A36;
  --accent: #D8A84D;              /* accent.mustard 编号/路径节点 */
  --accent-foreground: #243A36;
  --muted: #EFE7D8;
  --muted-foreground: #63736D;    /* text.secondary */

  /* —— 描边 / 输入 / 聚焦 —— */
  --border: #E7DDD0;              /* border.soft */
  --input: #E7DDD0;
  --ring: #315B50;

  /* —— 自定义品牌色（多色相，用户文档显式指定） —— */
  --terracotta: #B86A4A;          /* brand.terracotta 录音/强调 */
  --terracotta-foreground: #FFFDF8;
  --private: #5D6F8B;             /* status.private 私密标记 */
  --private-foreground: #FFFDF8;

  /* —— 图表（低饱和档案感） —— */
  --chart-1: #315B50;
  --chart-2: #B86A4A;
  --chart-3: #D8A84D;
  --chart-4: #5D6F8B;
  --chart-5: #63736D;

  /* —— 侧栏 —— */
  --sidebar: #FFFDF8;
  --sidebar-foreground: #243A36;
  --sidebar-primary: #315B50;
  --sidebar-primary-foreground: #FFFDF8;
  --sidebar-accent: #DDE8E2;
  --sidebar-accent-foreground: #243A36;
  --sidebar-border: #E7DDD0;
  --sidebar-ring: #315B50;

  /* —— 圆角 —— */
  --radius: 16px;
  /* 品牌前缀语义别名（fill-html-head.mjs semantic mapping） */
  --fmm-radius-sm: 12px;
  --fmm-radius-md: 12px;
  --fmm-radius-lg: 16px;
  --fmm-radius-xl: 20px;
  --fmm-radius-2xl: 24px;

  /* —— 字体族 —— */
  --font-serif: "Noto Serif SC", "Songti SC", serif;
  --font-sans: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* —— 语义别名（semantic-token-fallback） —— */
  --semantic-bg-canvas: var(--background);
  --semantic-bg-surface: var(--card);
  --semantic-bg-muted: var(--muted);
  --semantic-text-primary: var(--foreground);
  --semantic-text-secondary: var(--muted-foreground);
  --semantic-text-on-primary: var(--primary-foreground);
  --semantic-brand-forest: var(--primary);
  --semantic-brand-terracotta: var(--terracotta);
  --semantic-accent-mustard: var(--accent);
  --semantic-accent-mist: var(--secondary);
  --semantic-border-soft: var(--border);
  --semantic-status-private: var(--private);
  --semantic-ring: var(--ring);
}

.dark {
  --background: #1E2B27;
  --foreground: #F2EBDC;
  --card: #26332F;
  --card-foreground: #F2EBDC;
  --popover: #26332F;
  --popover-foreground: #F2EBDC;
  --primary: #6FA89B;
  --primary-foreground: #1E2B27;
  --secondary: #3A4A44;
  --secondary-foreground: #F2EBDC;
  --accent: #E0BC6A;
  --accent-foreground: #1E2B27;
  --muted: #313F3A;
  --muted-foreground: #9CA8A2;
  --border: #3A4A44;
  --input: #3A4A44;
  --ring: #6FA89B;
  --terracotta: #D08A68;
  --terracotta-foreground: #1E2B27;
  --private: #8AA0BD;
  --private-foreground: #1E2B27;
  --chart-1: #6FA89B;
  --chart-2: #D08A68;
  --chart-3: #E0BC6A;
  --chart-4: #8AA0BD;
  --chart-5: #9CA8A2;
  --sidebar: #26332F;
  --sidebar-foreground: #F2EBDC;
  --sidebar-primary: #6FA89B;
  --sidebar-primary-foreground: #1E2B27;
  --sidebar-accent: #3A4A44;
  --sidebar-accent-foreground: #F2EBDC;
  --sidebar-border: #3A4A44;
  --sidebar-ring: #6FA89B;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-terracotta: var(--terracotta);
  --color-terracotta-foreground: var(--terracotta-foreground);
  --color-private: var(--private);
  --color-private-foreground: var(--private-foreground);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --font-sans: var(--font-sans);
  --font-serif: var(--font-serif);
  --font-mono: var(--font-mono);

  --radius-sm: calc(var(--radius) - 4px);   /* 12 */
  --radius-md: calc(var(--radius) - 4px);   /* 12 */
  --radius-lg: var(--radius);               /* 16 */
  --radius-xl: calc(var(--radius) + 4px);   /* 20 */
  --radius-2xl: calc(var(--radius) + 8px);  /* 24 浮层专用 */
}

@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, .font-serif {
    font-family: var(--font-serif);
  }
}

<body class="min-h-screen bg-background font-sans antialiased">
  <div class="mx-auto w-full max-w-[420px] min-h-screen bg-background">
    <!-- 极简顶栏：照搬 curator-mobile.html -->
    <header class="sticky top-0 z-30 border-b border-border bg-card/80 backdrop-blur" style="padding-top:env(safe-area-inset-top)">
      <div class="flex items-center justify-between px-5 py-3">
        <span class="font-serif text-base text-foreground">家庭记忆博物馆</span>
        <a href="#" data-dom-id="fmm-nav-mine" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-muted-foreground hover:bg-muted hover:text-foreground">
          <i data-lucide="user" class="h-[18px] w-[18px]"></i>
        </a>
      </div>
    </header>

    <!-- 内容区 main slot：底部留出 fixed nav 高度 + 安全区 -->
    <main id="fmm-page-content" class="min-h-screen bg-background px-5 pb-[calc(72px+env(safe-area-inset-bottom))]">

      <!-- ① hero 静物照：满宽 3:2，圆角 lg，object-cover，h 约 240px -->
      <section class="pt-5">
        <figure class="overflow-hidden rounded-lg border border-border">
          <img src="../assets/hero-objects-stilllife.jpg" alt="家中旧物静物：课本、搪瓷杯、相册与机械表" class="block h-[240px] w-full object-cover" />
        </figure>
        <figcaption class="mt-2 flex items-center gap-1.5 text-[12px] text-muted-foreground">
          <i data-lucide="archive" class="h-3.5 w-3.5"></i>
          <span>从一件物品开始，搭一座你们自己的小博物馆</span>
        </figcaption>
      </section>

      <!-- ② 宋体大标题 + 副标题 -->
      <section class="pt-6">
        <h1 class="font-serif text-[28px] leading-tight text-foreground">把家里的故事，<br/>放进一座小小博物馆</h1>
        <p class="mt-3 text-[15px] leading-relaxed text-muted-foreground">每位家人选一件有故事的物品，一起搭一座只属于你们的小博物馆。</p>
      </section>

      <!-- ③ 身份选择：4 位家庭成员均可策展 -->
      <section class="pt-6">
        <div class="mb-2.5 flex items-baseline justify-between">
          <h2 class="text-[13px] font-medium text-foreground">选择策展成员</h2>
          <span class="text-[12px] text-muted-foreground">每位家人都可上传展品</span>
        </div>
        <div class="grid grid-cols-5 gap-2.5">
          <button type="button" data-fmm-role="member-select" data-member="妈妈" class="flex flex-col items-center gap-1.5 rounded-lg border border-border bg-card p-2.5">
            <span class="flex h-10 w-10 items-center justify-center rounded-full bg-muted font-serif text-[14px] text-foreground">妈</span>
            <span class="text-[12px] text-foreground">妈妈</span>
          </button>
          <button type="button" data-fmm-role="member-select" data-member="外婆" class="flex flex-col items-center gap-1.5 rounded-lg border border-border bg-card p-2.5">
            <span class="flex h-10 w-10 items-center justify-center rounded-full bg-muted font-serif text-[14px] text-foreground">婆</span>
            <span class="text-[12px] text-foreground">外婆</span>
          </button>
          <button type="button" data-fmm-role="member-select" data-member="外公" class="flex flex-col items-center gap-1.5 rounded-lg border border-border bg-card p-2.5">
            <span class="flex h-10 w-10 items-center justify-center rounded-full bg-muted font-serif text-[14px] text-foreground">公</span>
            <span class="text-[12px] text-foreground">外公</span>
          </button>
          <button type="button" data-fmm-role="member-select" data-member="爸爸" class="flex flex-col items-center gap-1.5 rounded-lg border border-border bg-card p-2.5">
            <span class="flex h-10 w-10 items-center justify-center rounded-full bg-muted font-serif text-[14px] text-foreground">爸</span>
            <span class="text-[12px] text-foreground">爸爸</span>
          </button>
          <button type="button" data-fmm-role="member-select" data-member="孩子" class="flex flex-col items-center gap-1.5 rounded-lg border border-border bg-card p-2.5">
            <span class="flex h-10 w-10 items-center justify-center rounded-full bg-muted font-serif text-[14px] text-foreground">孩</span>
            <span class="text-[12px] text-foreground">孩子</span>
          </button>
        </div>
      </section>

      <!-- ④ 建馆表单卡 -->
      <section class="pt-6">
        <div class="rounded-lg border border-border bg-card p-5">
          <div class="flex items-center justify-between">
            <h2 class="font-serif text-[18px] leading-tight text-foreground">为你们的博物馆开个头</h2>
            <span class="inline-flex items-center rounded-full bg-muted px-2 py-0.5 text-[11px] font-medium text-muted-foreground">第 1 步</span>
          </div>
          <p class="mt-1 text-[13px] leading-snug text-muted-foreground">这些之后都能改，先随便填。</p>

          <!-- 博物馆名称 -->
          <div class="mt-4">
            <label for="fmm-museum-name-input" class="mb-1.5 block text-[13px] font-medium text-foreground">博物馆名称</label>
            <div class="flex items-center gap-2 rounded-lg border border-border bg-background px-3.5 py-3 focus-within:border-primary focus-within:ring-2 focus-within:ring-ring/20">
              <i data-lucide="bookmark" class="h-4 w-4 shrink-0 text-muted-foreground"></i>
              <input id="fmm-museum-name-input" data-dom-id="fmm-museum-name" type="text" placeholder="给你们的博物馆起个名字" value="我们家的小博物馆" class="w-full bg-transparent text-[15px] text-foreground placeholder:text-muted-foreground/70 focus:outline-none" />
            </div>
          </div>

          <!-- 封面选择：1 张系统生成 + 1 张自定义上传 -->
          <div class="mt-4">
            <div class="mb-1.5 flex items-baseline justify-between">
              <label class="block text-[13px] font-medium text-foreground">封面</label>
              <span class="text-[11px] text-muted-foreground">系统推荐或自定义上传</span>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" data-fmm-role="cover-option" data-idx="0" class="overflow-hidden rounded-md border-2 border-primary bg-background">
                <img src="../assets/hero-objects-stilllife.jpg" alt="系统封面" class="aspect-[4/3] w-full object-cover" />
              </button>
              <button type="button" id="fmm-cover-upload" data-fmm-role="cover-option" data-idx="1" class="relative flex aspect-[4/3] flex-col items-center justify-center gap-1.5 rounded-md border-2 border-border bg-background text-muted-foreground">
                <i data-lucide="upload-cloud" class="h-6 w-6"></i>
                <span class="text-[12px]">上传自定义封面</span>
              </button>
              <input type="file" id="fmm-cover-file" accept="image/*" class="hidden" />
            </div>
          </div>
        </div>
      </section>

      <!-- ⑤ 主按钮：记录第一件物品，bg-primary 满宽 -->
      <section class="pt-5">
        <button type="button" data-dom-id="fmm-cta-start" class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary px-5 py-3.5 text-[15px] font-medium text-primary-foreground active:opacity-90">
          <span>记录第一件物品</span>
          <i data-lucide="arrow-right" class="h-4 w-4"></i>
        </button>
        <p class="mt-2.5 text-center text-[12px] leading-snug text-muted-foreground">下一步开始为第一件物品建档：拍照、说一段它发生过的事。</p>
      </section>

    </main>
  </div>

  <!-- 底部五栏 nav：canonicalHtmlByKey["home"]（home active） -->
  <nav data-mobile-nav="global" class="fixed bottom-0 inset-x-0 z-40 border-t border-border bg-card/95 backdrop-blur" style="padding-bottom:env(safe-area-inset-bottom)"><div class="mx-auto grid w-full max-w-[420px] grid-cols-5"><a data-nav-item data-nav-key="home" data-dom-id="fmm-nav-home" class="relative flex flex-col items-center justify-center gap-1 pt-2.5 pb-3 text-[11px] font-medium text-primary"><span class="absolute top-0 h-[3px] w-7 rounded-full bg-primary"></span><i data-lucide="home" class="h-[22px] w-[22px]"></i><span class="leading-none">首页</span></a><a data-nav-item data-nav-key="gallery" data-dom-id="fmm-nav-gallery" class="relative flex flex-col items-center justify-center gap-1 pt-2.5 pb-3 text-[11px] font-medium text-muted-foreground"><i data-lucide="layout-grid" class="h-[22px] w-[22px]"></i><span class="leading-none">展馆</span></a><a data-nav-item data-nav-key="create" data-dom-id="fmm-nav-create" class="relative flex flex-col items-center justify-center gap-1 pt-2.5 pb-3 text-[11px] font-medium text-muted-foreground"><i data-lucide="plus" class="h-[22px] w-[22px]"></i><span class="leading-none">创建</span></a><a data-nav-item data-nav-key="visit" data-dom-id="fmm-nav-visit" class="relative flex flex-col items-center justify-center gap-1 pt-2.5 pb-3 text-[11px] font-medium text-muted-foreground"><i data-lucide="eye" class="h-[22px] w-[22px]"></i><span class="leading-none">参观</span></a><a data-nav-item data-nav-key="mine" data-dom-id="fmm-nav-mine" class="relative flex flex-col items-center justify-center gap-1 pt-2.5 pb-3 text-[11px] font-medium text-muted-foreground"><i data-lucide="user" class="h-[22px] w-[22px]"></i><span class="leading-none">我的</span></a></div></nav>

  <script>if(window.lucide){lucide.createIcons();}</script>
  <script src="../assets/fmm-app.js"></script>

  <script>
  /* fmm-interaction-v2 · 数据持久化 */
(function(){
  function ready(fn){ if(document.readyState!=='loading'){fn();}else{document.addEventListener('DOMContentLoaded',fn);} }
  function inIframe(){ try { return window.self !== window.top; } catch(e){ return false; } }
  function bindJumps(jumps){
    Object.keys(jumps).forEach(function(domId){
      var el = document.querySelector('[data-dom-id="'+domId+'"]');
      if(el){ el.addEventListener('click', function(){ if(inIframe()){return;} try{ location.href = jumps[domId]; }catch(_){} }); }
    });
  }

  /* —— 封面选择（border 联动）—— */
  function setCoverMobile(btn, selected){
    if(!btn) return;
    if(selected){ btn.classList.remove('border-border'); btn.classList.add('border-primary'); }
    else { btn.classList.remove('border-primary'); btn.classList.add('border-border'); }
  }

  ready(function(){
    var FMM = window.FMM;
    var data = FMM ? FMM.load() : null;
    var museum = data ? data.museum : null;

    /* 身份选择 - 所有家庭成员均可策展 */
    var memberButtons = document.querySelectorAll('[data-fmm-role="member-select"]');
    var curIdentity = museum ? (museum.identity || '妈妈') : '妈妈';
    memberButtons.forEach(function(btn){
      var member = btn.getAttribute('data-member');
      if(member === curIdentity){ btn.classList.add('border-primary','bg-secondary'); btn.classList.remove('border-border','bg-card'); }
      btn.addEventListener('click', function(){
        memberButtons.forEach(function(b){ b.classList.remove('border-primary','bg-secondary'); b.classList.add('border-border','bg-card'); });
        btn.classList.add('border-primary','bg-secondary'); btn.classList.remove('border-border','bg-card');
        var d = FMM.load(); d.museum.identity = member; FMM.save(d);
      });
    });

    /* 博物馆名称：加载恢复 + input 持久化 */
    var nameInput = document.querySelector('[data-dom-id="fmm-museum-name"]');
    if(nameInput){
      if(museum && museum.name){ nameInput.value = museum.name; }
      nameInput.addEventListener('input', function(){
        var d = FMM.load(); d.museum.name = nameInput.value; FMM.save(d);
      });
    }

    /* 封面候选：1 系统生成 + 1 自定义上传 */
    var coverOptionBtns = document.querySelectorAll('[data-fmm-role="cover-option"]');
    var coverUpload = document.getElementById('fmm-cover-upload');
    var coverFileInput = document.getElementById('fmm-cover-file');
    var curCover = museum ? museum.cover : 0;

    function selectCover(idx){
      var d = FMM.load(); d.museum.cover = idx; FMM.save(d);
      coverOptionBtns.forEach(function(b){
        if(String(b.getAttribute('data-idx')) === String(idx)){
          b.classList.remove('border-border'); b.classList.add('border-primary');
        } else {
          b.classList.remove('border-primary'); b.classList.add('border-border');
        }
      });
    }

    /* 初始化选中态 */
    coverOptionBtns.forEach(function(b){
      var bIdx = b.getAttribute('data-idx');
      if(String(bIdx) === String(curCover)){
        b.classList.remove('border-border'); b.classList.add('border-primary');
      } else {
        b.classList.remove('border-primary'); b.classList.add('border-border');
      }
    });

    /* 系统封面（idx=0）点击选中 */
    coverOptionBtns.forEach(function(b){
      if(String(b.getAttribute('data-idx')) === '0'){
        b.addEventListener('click', function(){ selectCover(0); });
      }
    });

    /* 恢复自定义封面预览 */
    if(coverUpload && museum && museum.coverCustom){
      coverUpload.style.backgroundImage = 'url(' + museum.coverCustom + ')';
      coverUpload.style.backgroundSize = 'cover';
      coverUpload.style.backgroundPosition = 'center';
      coverUpload.innerHTML = '';
    }

    /* 上传按钮点击 → 触发 file input */
    if(coverUpload){
      coverUpload.addEventListener('click', function(e){
        e.preventDefault();
        if(coverFileInput){ coverFileInput.click(); }
      });
    }

    /* 封面上传：FileReader 读取 → 预览 → 选中 */
    if(coverFileInput){
      coverFileInput.addEventListener('change', function(e){
        var file = e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          var d = FMM.load(); d.museum.coverCustom = ev.target.result; FMM.save(d);
          if(coverUpload){
            coverUpload.style.backgroundImage = 'url(' + ev.target.result + ')';
            coverUpload.style.backgroundSize = 'cover';
            coverUpload.style.backgroundPosition = 'center';
            coverUpload.innerHTML = '';
          }
          selectCover(1);
        };
        reader.readAsDataURL(file);
      });
    }

    bindJumps({ 'fmm-cta-start': 'page-archive-card-mobile.html' });
    var navJumps = {
      'fmm-nav-home': 'page-welcome-setup-mobile.html',
      'fmm-nav-gallery': 'page-exhibition-editor-mobile.html',
      'fmm-nav-create': 'page-archive-card-mobile.html',
      'fmm-nav-visit': 'page-visit-exhibit-mobile.html'
    };
    Object.keys(navJumps).forEach(function(domId){
      document.querySelectorAll('[data-dom-id="'+domId+'"]').forEach(function(el){
        el.addEventListener('click', function(e){ e.preventDefault(); location.href = navJumps[domId]; });
      });
    });
    document.querySelectorAll('[data-dom-id="fmm-nav-mine"]').forEach(function(el){
      el.addEventListener('click', function(e){ e.preventDefault(); alert('个人中心 · 待开发'); });
    });
    if(window.lucide){ lucide.createIcons(); }
  });
})();
  </script>
</body>
</html>
